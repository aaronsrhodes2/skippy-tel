# Push-to-deploy. Every push to main:
#   test         the suites (run-tests.yml: two parallel jobs, xdist). Needed by infra, mentat and portal.
#   portal-image builds + pushes the portal image WHILE the tests run (needs only `gate`). An image that later fails
#                the tests is harmless: nothing deploys it.
#   portal       needs test + portal-image: notes the serving revision, deploys to Cloud Run, smoke-tests it. If the deploy
#                or the smoke test fails, ALL traffic goes back to the revision that was serving (the job still ends red).
#                By hand, from a phone: the `rollback` workflow (rollback.yml). docs/portal/remote-recovery.md.
#   infra        terraform apply infra/gcp-games (after the tests).
#   changes + mentat-test + mentat   Mentat is tested and deployed only when something it is built from changed
#                (tools/ci_changes.py); a manual run always does everything. The portal NEVER waits on these.
# Pipeline, timings and the needs/if table: docs/cicd.md.
#
# Auth is Workload Identity Federation: GitHub's OIDC token for this repo is
# exchanged for short-lived credentials as skippy-deployer. No key exists.
# Deploy jobs no-op until infra/bootstrap/bootstrap.sh has filled in
# PROJECT_NUMBER below (see docs/cicd.md).
name: deploy

on:
  push:
    branches: [main]      # Google only accepts deploys from main (infra/bootstrap/main.tf)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write      # lets the job request a GitHub OIDC token for GCP

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: skippy-tel
  REGION: us-west1
  WIF_PROVIDER: projects/1015050363686/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: skippy-deployer@skippy-tel.iam.gserviceaccount.com
  RUNTIME_SA: skippy-agent@skippy-tel.iam.gserviceaccount.com
  IMAGE: us-west1-docker.pkg.dev/skippy-tel/skippy/portal
  # sigma-ground commit served by Experiments and the Mentat service (bump to update both).
  SIGMA_GROUND_REF: a763071b4beb87129f2672624e989a39ef7a1199
  # Star Control Zero, played at /starcontrol: the release tag of github.com/aaronsrhodes2/star-control-precursors
  # whose web build the portal image carries, and the SHA-256 of that release's scz-web.tar.gz (the build stops
  # if they disagree). To ship a new build of the game: publish a release there, then change BOTH lines.
  STARCONTROL_REF: web-2026-10-02
  STARCONTROL_SHA256: 15866e0e94ab0069f02f8c4d0a3bb31bf4fe7a96e54337f29cadc37fe74999b3
  # Who may sign in to the portal, and who is an admin. Comma-separated.
  ALLOWED_EMAILS: aaron.s.rhodes@gmail.com
  ADMIN_EMAILS: aaron.s.rhodes@gmail.com

jobs:
  test:
    # The suites live in run-tests.yml (shared with test.yml), as two parallel jobs: everything but flask-api, and flask-api.
    # This job's result is "success" only when every job inside it succeeded.
    uses: ./.github/workflows/run-tests.yml

  changes:
    # Does Mentat need testing and deploying on this run? Answers `mentat=true|false` (tools/ci_changes.py: false only when
    # it PROVES nothing Mentat is built from differs from the last successful deploy; any doubt, and any manual run, is true).
    # Nothing that must run `needs` this job except the two Mentat jobs, so a wrong "false" can never stop the portal.
    runs-on: ubuntu-latest
    timeout-minutes: 5      # (every job has one: GitHub's default is 6 HOURS, and a hung job holds the deploy group that long)
    permissions:
      contents: read
      actions: read      # to ask which deploy run was the last green one
    outputs:
      mentat: ${{ steps.decide.outputs.mentat }}
    steps:
      - uses: actions/checkout@v4
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last SUCCESSFUL deploy of main, not the push's `before`: a cancelled or red run deploys nothing, so
          # diffing against `before` would lose a Mentat change made in one. Empty (any doubt) means "run everything".
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main --status success --limit 1 \
                   --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || base=""
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if ! out=$(python3 tools/ci_changes.py --event "$EVENT" --base "$BASE"); then
            out="mentat=true"$'\n'"reason=tools/ci_changes.py failed: run everything"
          fi
          echo "$out" | tee -a "$GITHUB_OUTPUT"
          echo "Mentat: $(echo "$out" | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  mentat-test:
    # Mentat (and Weapon vs. Armor on it) against the pinned sigma-ground, fetched and
    # installed exactly as mentat/Dockerfile does. Catches a SIGMA_GROUND_REF bump that breaks it.
    # Skipped (with everything that needs it) when `changes` says nothing Mentat is built from moved.
    needs: [changes]
    if: needs.changes.outputs.mentat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mentat/requirements.txt
      - run: pip install -r mentat/requirements.txt pytest
      - run: |
          mkdir -p "$RUNNER_TEMP/sigma-ground"
          curl -fsSL -m 300 "https://github.com/aaronsrhodes2/sigma-ground/archive/${SIGMA_GROUND_REF}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/sigma-ground" --strip-components=1
      - run: SIGMA_GROUND_DIR="$RUNNER_TEMP/sigma-ground" python -m pytest mentat/tests -q

  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [[ "$WIF_PROVIDER" == *PROJECT_NUMBER* ]]; then
            echo "::notice::Not bootstrapped yet — run infra/bootstrap/bootstrap.sh. Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  infra:
    needs: [test, gate]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15     # enough for an apply that stops and restarts the VM; a hang ends as a clear failure
    env:
      # The monthly budget alert (infra/gcp-games/budget.tf) is created only when the repository variable
      # BILLING_ACCOUNT is set (Settings > Secrets and variables > Actions > Variables). Unset = empty = no budget.
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
    defaults:
      run:
        working-directory: infra/gcp-games
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false -backend-config="bucket=${PROJECT_ID}-tfstate"
      - run: terraform apply -input=false -auto-approve -var "project=${PROJECT_ID}"

  mentat:
    # sigma-ground's physics tools as a public API (mentat/). Runs as the
    # zero-permission skippy-mentat identity from infra/bootstrap; skipped,
    # with a notice, until bootstrap has created it.
    needs: [test, mentat-test, changes, gate]
    if: needs.gate.outputs.ready == 'true' && needs.changes.outputs.mentat == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MENTAT_SA: skippy-mentat@skippy-tel.iam.gserviceaccount.com
      MENTAT_IMAGE: us-west1-docker.pkg.dev/skippy-tel/skippy/mentat
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: identity
        run: |
          if out=$(gcloud iam service-accounts describe "$MENTAT_SA" --format='value(email)' 2>&1); then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            echo "::notice::Can't see Mentat's identity ($MENTAT_SA): $(echo "$out" | grep -m1 -E 'ERROR|denied|not found' || echo "$out" | tail -1). If it doesn't exist, re-run infra/bootstrap/bootstrap.sh in Cloud Shell. Skipping Mentat."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.identity.outputs.ready == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push
        if: steps.identity.outputs.ready == 'true'
        run: |
          docker build -f mentat/Dockerfile --build-arg SIGMA_GROUND_REF="$SIGMA_GROUND_REF" -t "$MENTAT_IMAGE:$GITHUB_SHA" .
          docker push "$MENTAT_IMAGE:$GITHUB_SHA"
      - name: Deploy to Cloud Run
        if: steps.identity.outputs.ready == 'true'
        run: |
          gcloud run deploy skippy-mentat \
            --image "$MENTAT_IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --service-account "$MENTAT_SA" \
            --no-invoker-iam-check \
            --cpu 1 --memory 1Gi \
            --concurrency 8 \
            --max-instances 2 \
            --timeout 60
      - name: Smoke test
        if: steps.identity.outputs.ready == 'true'
        run: |
          URL=$(gcloud run services describe skippy-mentat --region "$REGION" --format='value(status.url)')
          echo "Mentat: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS -m 30 "$URL/health"
          curl -fsS -m 30 "$URL/tools" | python3 -c "import json,sys; n=len(json.load(sys.stdin)); print(n, 'tools'); assert n > 100"
          curl -fsS -m 30 -X POST -H 'Content-Type: application/json' \
            -d '{"value": 1, "from_units": "mile", "to_units": "km"}' "$URL/tools/convert_units"
          curl -fsS -m 60 -X POST -H 'Content-Type: application/json' \
            -d '{"question": "how fast does a 5 cm copper ball hit the ground from 10 km?"}' "$URL/ask" \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; print(r['value'], r['units']); assert r['value']"
          curl -fsS -m 30 "$URL/wva/catalog" \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; n=sum('weapon' in w for w in r['weapons']); print(n, 'Weapon vs. Armor presets'); assert n >= 20"
          curl -fsS -m 60 -X POST -H 'Content-Type: application/json' \
            -d '{"weapon": {"type": "kinetic", "mass_kg": 0.0079, "velocity_ms": 715, "radius_m": 0.0038, "material": "steel_mild"}, "armor_layers": [{"material": "ceramic_alumina", "thickness_m": 0.015}], "environment": "atmosphere_earth", "distance_m": 100}' \
            "$URL/wva/solve" | python3 -c "import json,sys; r=json.load(sys.stdin)['result']; print(r['verdict']); assert r['layers']"

  portal-image:
    # Built while the tests run: it needs only `gate`. Pushing an image that then fails the tests is harmless (the
    # `portal` job, which deploys it, needs `test`). GIT_SHA / BUILD_TIME are baked in, so a rolled-back revision still
    # reports the build it really is (GET /version). The layer cache (type=gha) makes a build that changed only portal/
    # code skip pip install and the sigma-ground download.
    needs: [gate]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      # skip_install: the runner image already carries gcloud (this job runs only `gcloud auth configure-docker`); the
      # action still wires up the credentials. Saves the ~25 s download.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - id: now
        run: echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: portal/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            SIGMA_GROUND_REF=${{ env.SIGMA_GROUND_REF }}
            STARCONTROL_REF=${{ env.STARCONTROL_REF }}
            STARCONTROL_SHA256=${{ env.STARCONTROL_SHA256 }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.now.outputs.utc }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false      # a plain single-manifest image, as `docker build` made; no attestation index for Cloud Run to choke on

  portal:
    # Deploys what portal-image built, once the tests are green. Never waits on Mentat.
    # EVERY step the rollback logic relies on is in THIS job: PREV_REVISION is written to $GITHUB_ENV before the deploy and
    # read by the failure() step below, and `steps.deploy` is this job's own step.
    needs: [test, portal-image, gate]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # 20 minutes: a normal portal deploy takes 2-4. GitHub's default (6 hours) let one hung smoke test hold the deploy group
    # for hours. The rollback step below also runs when the run is CANCELLED (by hand or from the admin page), not only failed.
    timeout-minutes: 20
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      # skip_install: every command below (run services describe / deploy / update-traffic) is in the runner's gcloud.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true
      - name: Copy the recovery buttons' GitHub token into Secret Manager
        # The Captain keeps the token in his vault; the repo holds a copy as the Actions secret PORTAL_ACTIONS_TOKEN
        # (GitHub forbids secret names starting with GITHUB_). This puts it in Secret Manager as `github-actions-token`
        # (a new version only when the value changed), lets the portal's runtime account read it, and tells the deploy
        # step to hand it to the portal. The deployer has roles/secretmanager.admin for this (granted 2026-09-30).
        # Any failure only means the admin page's recovery buttons stay off: never a failed deploy.
        env:
          TOKEN: ${{ secrets.PORTAL_ACTIONS_TOKEN }}
        run: |
          s=github-actions-token
          if [ -z "$TOKEN" ]; then echo "::notice::no PORTAL_ACTIONS_TOKEN repo secret: the recovery buttons stay off"; exit 0; fi
          if ! gcloud secrets describe "$s" >/dev/null 2>&1; then
            gcloud secrets create "$s" --replication-policy=automatic >/dev/null 2>&1 \
              || { echo "::warning::couldn't create the $s secret (does the deployer have Secret Manager rights?): buttons stay off"; exit 0; }
          fi
          current=$(gcloud secrets versions access latest --secret="$s" 2>/dev/null || true)
          if [ "$current" != "$TOKEN" ]; then
            printf '%s' "$TOKEN" | gcloud secrets versions add "$s" --data-file=- >/dev/null \
              || { echo "::warning::couldn't store a new version of $s: buttons stay off"; exit 0; }
            echo "Stored a new version of \`$s\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          gcloud secrets add-iam-policy-binding "$s" --member="serviceAccount:$RUNTIME_SA" \
            --role=roles/secretmanager.secretAccessor >/dev/null \
            || { echo "::warning::couldn't let the portal read $s: buttons stay off"; exit 0; }
          echo "EXTRA_SECRETS=,GITHUB_ACTIONS_TOKEN=$s:latest" >> "$GITHUB_ENV"
      - name: Note the revision serving now (the way back if this deploy goes wrong)
        # Recorded BEFORE the deploy, because afterwards "the previous one" can no longer be told apart from "the new one".
        # A new service has none: then there is nothing to roll back to, and a failed first deploy just stays red.
        run: |
          prev=$(gcloud run services describe skippy-portal --region "$REGION" \
                   --format='value(status.traffic[0].revisionName)' 2>"$RUNNER_TEMP/prev.err" || true)
          if [[ "$prev" =~ ^skippy-portal-[a-z0-9-]+$ ]]; then
            echo "PREV_REVISION=$prev" >> "$GITHUB_ENV"
            echo "Serving before this deploy: \`$prev\` (the rollback target if the deploy or its smoke test fails)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No revision is serving yet, or gcloud could not tell ('$(head -c 200 "$RUNNER_TEMP/prev.err")'): a failed deploy will NOT be rolled back."
          fi
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy skippy-portal \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --no-invoker-iam-check \
            --timeout 900 \
            --max-instances 1 \
            --memory 1Gi \
            --set-env-vars "^|^ALLOWED_EMAILS=${ALLOWED_EMAILS}|ADMIN_EMAILS=${ADMIN_EMAILS}|GCP_PROJECT=${PROJECT_ID}|GCP_ZONE=us-west1-b|GCP_INSTANCE=skippy-games|CHAT_MODEL=claude-haiku-4-5|DISCORD_INVITE=gPTVS7Hmj|PORTAL_URL=https://makerportal.live|MENTAT_URL=https://skippy-mentat-1015050363686.us-west1.run.app|DOOMLOOP_BUCKET=skippy-tel-doomloop-dev" \
            --set-secrets "FLASK_SECRET_KEY=portal-flask-secret:latest,GOOGLE_CLIENT_ID=portal-google-client-id:latest,GOOGLE_CLIENT_SECRET=portal-google-client-secret:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,DISCORD_BOT_TOKEN=discord-bot-token:latest${EXTRA_SECRETS:-}"
      - name: Send all traffic to the new revision
        # A rollback (here, or the `rollback` workflow) PINS traffic to one named revision. Cloud Run then no longer
        # moves traffic to a newly deployed revision by itself: the next deploy would go green and serve nothing
        # new. `--to-latest` hands the routing back to "the newest revision", and is a no-op when it already is.
        run: gcloud run services update-traffic skippy-portal --region "$REGION" --to-latest
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe skippy-portal --region "$REGION" --format='value(status.url)')
          echo "Portal: $URL" >> "$GITHUB_STEP_SUMMARY"
          # (--retry: a failed smoke test now ROLLS BACK, so one transient 503 must not undo a good deploy.)
          # (-m on EVERY curl: a revision that accepts connections but never answers would otherwise hold each try for
          # Cloud Run's whole 900 s request timeout, about an hour with the retries.)
          curl -fsS -m 20 --retry 3 --retry-delay 5 "$URL/health"
          code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' -X POST "$URL/home/report" -H 'Content-Type: application/json' -d '{}')
          [ "$code" = 401 ] || { echo "/home/report without a token answered $code, expected 401"; exit 1; }
          # The reconciler's door (the home reporter lists what the portal holds here): it must exist AND be locked.
          # 404 is accepted only while that route isn't in the code (the reporter-recovery change adds it); once
          # portal/app.py defines it, it must answer 401.
          code=$(curl -s -m 30 --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}' "$URL/home/workshop")
          if grep -q '"/home/workshop")' portal/app.py; then want=401; else want="401|404"; fi
          [[ "$code" =~ ^($want)$ ]] || { echo "GET /home/workshop without a token answered $code, expected $want"; exit 1; }
          curl -fsS -m 30 --retry 3 --retry-delay 5 -o /dev/null "$URL/privacy"   # public page: renders from the telemetry lists
          # The Captain's page, signed out: a redirect to sign-in or the sign-in page. A 5xx (or a 404/401) here means
          # his dashboard is broken for everyone, so fail the deploy while the previous revision can still be restored.
          code=$(curl -s -m 30 --retry 3 --retry-delay 5 -o /dev/null -w '%{http_code}' "$URL/me")
          case "$code" in 200|301|302|303|307|308) ;; *) echo "/me signed out answered $code, expected a redirect or the sign-in page"; exit 1 ;; esac
          curl -fsS -m 20 -o /dev/null "$URL/"   # login page renders => secrets + OAuth config loaded
          curl -fsS -m 20 "$URL/experiments/benchmark" | grep -q "Wolfram"            # benchmark results bundled
          curl -fsS -m 20 "$URL/experiments/radiance/" | grep -q "viewer.js"          # Radiance bundled
          curl -fsS -m 20 "$URL/starcontrol/version" | grep -Eq '"bundled": ?true'    # Star Control Zero bundled
          # Doom Loop's dev channel: the route must answer (bundled true OR false: a build arrives from the game's repo,
          # not from this deploy, so "no build yet" is a healthy answer).
          curl -fsS -m 20 "$URL/doomloop/version" | grep -Eq '"bundled": ?(true|false)'
      - name: Roll back to the previous revision
        # Reached only when something above failed, or the run was CANCELLED part way (a person cancelling a hung deploy,
        # or the admin page's "Cancel the stuck deploy"): failure() is false for a cancelled job, and a cancel after the
        # traffic step would otherwise leave the new, possibly broken revision serving everyone (audit A2).
        # A failure BEFORE the deploy step (build, push) changed nothing, so there is nothing to undo; from the deploy step
        # on, put ALL traffic back on the revision that served before. (When the new revision never became ready, Cloud
        # Run kept serving the old one: this just makes it explicit.) Its own 5 minutes: it must finish inside a cancel.
        # The job still ends red on purpose: the fix is a new push, and the next deploy sends traffic forward again.
        if: (failure() || cancelled()) && env.PREV_REVISION != '' && steps.deploy.outcome != 'skipped'
        timeout-minutes: 5
        run: |
          URL=$(gcloud run services describe skippy-portal --region "$REGION" --format='value(status.url)' || true)
          if gcloud run services update-traffic skippy-portal --region "$REGION" --to-revisions "$PREV_REVISION=100"; then
            echo "::error::DEPLOY FAILED and was ROLLED BACK: the portal is serving $PREV_REVISION again (the revision from before commit ${GITHUB_SHA::7}). The new version is NOT live. This job stays red on purpose: fix forward and push again."
            echo "### ROLLED BACK to \`$PREV_REVISION\`" >> "$GITHUB_STEP_SUMMARY"
            echo "The deploy of \`${GITHUB_SHA::7}\` failed, so all traffic went back to \`$PREV_REVISION\`. The portal's in-memory state restarts with it; skippy-pc's reporter re-sends what the chat needs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::ROLLBACK FAILED: could not move traffic back to $PREV_REVISION. Run the 'rollback' workflow (Actions > rollback > Run workflow), or see docs/portal/remote-recovery.md."
            exit 1
          fi
          # Prove it: the old revision may have been scaled to zero, so allow it a few seconds to wake.
          if curl -fsS -m 20 --connect-timeout 10 --retry 6 --retry-delay 5 --retry-all-errors "$URL/health"; then
            echo "Health after rollback: ok" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Rolled back to $PREV_REVISION, but /health still does not answer: the problem is not the new revision. See docs/portal/remote-recovery.md."
            exit 1
          fi
