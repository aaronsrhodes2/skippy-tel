# One tap to put the portal back on an earlier revision. From a phone: GitHub mobile > this repo > Actions >
# rollback > Run workflow > Run workflow (leave the box blank). No typing, no Cloud Console, no PC.
#
# Why it exists: a deploy that passes its smoke test can still be wrong in a way only the Captain sees (a chat that
# freezes, a page that blanks), and deploy.yml's own rollback covers only what the smoke test notices. Cloud Run keeps
# every revision, so going back is just moving the traffic. (Incident 2026-09-30: after a bad stretch the only way
# back was another deploy, which needed a working chat to ask for.)
#
# blank       step back one: the newest healthy revision OLDER than the one serving now
# a name      that revision (the run summary lists the last 5, newest first, with the commit each was built from)
# latest      undo a rollback: send traffic to the newest revision again
#
# The portal keeps its state in memory (home jobs, chat records), so ANY revision change restarts it. That is expected:
# skippy-pc's reporter re-sends what the chat needs within about 30 seconds (docs/portal/README.md).
# The next push to main deploys normally: deploy.yml sends traffic forward again whatever this left pinned.
name: rollback

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Leave BLANK to go back one revision. Or a revision name from the run summary. Or 'latest' to undo a rollback."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write      # lets the job request a GitHub OIDC token for GCP

# Its own group, never deploy's: GitHub keeps only one PENDING run per group and drops the older, so a rollback queued
# behind a deploy would be cancelled by the next push's deploy. A rollback must not wait on, or lose to, anything.
concurrency:
  group: rollback
  cancel-in-progress: false

env:
  PROJECT_ID: skippy-tel
  REGION: us-west1
  WIF_PROVIDER: projects/1015050363686/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: skippy-deployer@skippy-tel.iam.gserviceaccount.com

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Move the traffic
        env:
          # Through the environment, never interpolated into the script: what is typed here can't inject shell.
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          serving=$(gcloud run services describe skippy-portal --region "$REGION" --format='value(status.traffic[0].revisionName)')
          echo "Serving now: ${serving:-unknown}"
          gcloud run revisions list --service skippy-portal --region "$REGION" --format=json > "$RUNNER_TEMP/revisions.json"

          # The list goes in the job summary first, so it is there even if the pick below finds nothing safe.
          # (--opt=value, so a value that starts with a dash can't be read as another option)
          if ! target=$(python3 tools/rollback_pick.py --revisions="$RUNNER_TEMP/revisions.json" \
                          --serving="$serving" --want="$REVISION" --summary="$GITHUB_STEP_SUMMARY"); then
            echo "::error::Nothing was changed: no safe revision to go back to (the reason is just above; the run summary lists the revisions)."
            exit 1
          fi

          if [ "$serving" = "$target" ]; then
            echo "::notice::$target is already serving: nothing to move."
          elif [ "$target" = latest ]; then
            gcloud run services update-traffic skippy-portal --region "$REGION" --to-latest
          else
            gcloud run services update-traffic skippy-portal --region "$REGION" --to-revisions "$target=100"
          fi

          URL=$(gcloud run services describe skippy-portal --region "$REGION" --format='value(status.url)')
          now=$(gcloud run services describe skippy-portal --region "$REGION" --format='value(status.traffic[0].revisionName)')
          # The old revision may have been scaled to zero: give it a few seconds to wake.
          if curl -fsS -m 20 --connect-timeout 10 --retry 6 --retry-delay 5 --retry-all-errors "$URL/health"; then
            health=ok
          else
            health=FAILING
            echo "::error::Traffic moved, but /health does not answer. The cause may not be the revision: see docs/portal/remote-recovery.md."
          fi
          {
            echo
            echo "### Result"
            echo "- Was serving: \`${serving:-unknown}\`"
            echo "- Asked for: \`$target\`"
            echo "- Serving now: \`$now\`"
            echo "- /health: **$health**"
            echo "- The next push to main deploys normally and sends traffic forward again."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$health" = ok ]
