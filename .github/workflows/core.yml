# SkippyCore's CI: the unit tests, then the simulator (core/sim: Ubuntu 26.04 with its own Docker, the real deployer,
# compose file and smoke test, stand-in models on CPU). The box's pull deployer deploys a main commit only when this
# workflow's `core` check is green on it (core/deployer/deployer.py, REQUIRED_CHECK=core), so it runs on EVERY push:
# a push that touches nothing SkippyCore runs (core/, services/flask-api/, this file) skips the simulator and `core`
# still goes green.
name: core

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sim: ${{ steps.decide.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # Anything unclear (a manual run, a new branch, a force push) runs the simulator.
          if [[ "$EVENT" != push ]] || ! [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE" =~ ^0+$ ]] \
             || ! changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null)"; then
            echo "sim=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE '^(core/|services/flask-api/|\.github/workflows/core\.yml$)' <<<"$changed"; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
          fi

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask requests pytest
      - run: python -m pytest core/tests tools/tests/test_models_baseline.py -q

  sim:
    needs: [changes, unit]
    if: needs.changes.outputs.sim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/core-models
          key: core-standins-${{ hashFiles('core/models.json') }}
      - name: Fetch the stand-in models (prints each sha256 to pin in core/models.json)
        run: python3 core/llm/models.py fetch --root ~/core-models --full ""
      - name: Run the simulator
        run: MODELS_ROOT=~/core-models bash core/sim/run.sh

  core:
    # The check the box's deployer requires. Green when the tests passed and the simulator passed or had nothing to do.
    name: core
    needs: [changes, unit, sim]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          UNIT: ${{ needs.unit.result }}
          SIM: ${{ needs.sim.result }}
          WANTED: ${{ needs.changes.outputs.sim }}
        run: |
          echo "changes=$CHANGES unit=$UNIT sim=$SIM (simulator wanted: $WANTED)"
          [[ "$CHANGES" == success && "$UNIT" == success ]] || exit 1
          if [[ "$WANTED" == true ]]; then [[ "$SIM" == success ]]; else [[ "$SIM" == skipped ]]; fi
