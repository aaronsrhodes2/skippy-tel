# The test suites, written ONCE: deploy.yml (before it deploys) and test.yml (pull requests) both call this, so the
# two can never test different things or at different speeds. No cloud credentials here.
#
# Two jobs in parallel, because flask-api has its own requirements (its `app` package and the portal's app.py can't
# share one interpreter session anyway). Each runs pytest under xdist: `-n auto` is one worker per CPU (2 on a
# GitHub-hosted runner for a private repo) and `--dist loadfile` keeps every test FILE on a single worker, so tests that
# share state inside a file (module-level fakes, a port, a temp dir) behave as they do serially.
name: run-tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  suite:
    # portal + memory + tools + home-reporter + claude-bridge + mentat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            portal/requirements.txt
            tools/requirements-ci.txt
      - run: pip install -r portal/requirements.txt -r tools/requirements-ci.txt
      - run: python -m pytest portal/tests memory/tests tools/tests services/home-reporter/tests services/claude-bridge/tests mentat/tests -q -n auto --dist loadfile --durations=10

  flask-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/flask-api/requirements.txt
            tools/requirements-ci.txt
      - run: pip install -r services/flask-api/requirements.txt -r tools/requirements-ci.txt
      - run: python -m pytest services/flask-api/tests -q -n auto --dist loadfile --durations=10
