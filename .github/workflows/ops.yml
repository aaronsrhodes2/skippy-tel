# Remote hands on the games VM, for Claude (or anyone with repo write access):
# read status and logs, start/stop/restart — without anyone clicking the
# portal. Run from the Actions tab or `workflow_dispatch`; output is the job
# log, with every secret value masked by GitHub before it's written.
# Uses the deployer identity the deploy workflow already has (compute.admin
# on the project); no extra permissions.
name: ops

on:
  # A push touching the ops tooling runs a read-only `status` as a self-test
  # (and registers the workflow so workflow_dispatch works on this branch).
  push:
    branches: [main]      # Google only accepts main (infra/bootstrap/main.tf)
    paths: [.github/workflows/ops.yml, scripts/remote.py]
  workflow_dispatch:
    inputs:
      command:
        description: "status | logs | start | stop | restart | discord-setup | tail | search | stats | restart-game | home | configure"
        required: true
        default: status
        type: choice
        options: [status, logs, start, stop, restart, discord-setup, tail, search, stats, restart-game, home, configure]
      args:
        description: "logs/tail/restart-game: game id (tail: + line count); search: game id + regex; start: game ids"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops
  cancel-in-progress: false

env:
  WIF_PROVIDER: projects/1015050363686/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: skippy-deployer@skippy-tel.iam.gserviceaccount.com

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements.txt
      - run: pip install -q google-cloud-compute==1.54.0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      # `home` and `discord-setup` ask the portal, which accepts only a Google ID
      # token for the deployer.
      - id: idtoken
        if: inputs.command == 'home' || inputs.command == 'discord-setup'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: skippy-portal-ops
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false
      - name: ${{ inputs.command || 'status' }} ${{ inputs.args }}
        env:
          COMMAND: ${{ inputs.command || 'status' }}
          ARGS: ${{ inputs.args }}
          OPS_ID_TOKEN: ${{ steps.idtoken.outputs.id_token }}
        # ARGS is split on spaces on purpose (game ids); passed via env, never
        # interpolated into the script, so it can't inject shell.
        run: |
          set -o pipefail
          read -r -a args <<< "$ARGS"
          python scripts/remote.py "$COMMAND" "${args[@]}" | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
