# Tests for pull requests into main (deploy.yml runs them again on merge,
# before deploying). No cloud credentials here: Google only trusts main.
# The suites themselves live in run-tests.yml, shared with deploy.yml.
name: test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/run-tests.yml

  shell-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n infra/gcp-games/*.sh infra/bootstrap/*.sh scripts/games.sh tools/*.sh
