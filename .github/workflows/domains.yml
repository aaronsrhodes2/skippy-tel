# The portal's own domains (makerportal.live, makerportal.studio): Cloud DNS zones, Google ownership, Cloud Run domain
# mappings and their records, all by tools/domains.py. Idempotent: run it again any time; it says what it's waiting for
# (usually the registrar's nameservers, then the certificate). The only hand step is the nameservers at Squarespace.
name: domains

on:
  push:
    branches: [main]      # Google only accepts main (infra/bootstrap/main.tf)
    paths: [.github/workflows/domains.yml, tools/domains.py]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: domains
  cancel-in-progress: false

env:
  WIF_PROVIDER: projects/1015050363686/locations/global/workloadIdentityPools/github/providers/github
  DEPLOYER_SA: skippy-deployer@skippy-tel.iam.gserviceaccount.com

jobs:
  domains:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Site Verification needs its own OAuth scope on top of cloud-platform.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/siteverification
      - name: Hook up the domains
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python tools/domains.py
