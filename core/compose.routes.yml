# Roads and addresses on SkippyCore (2026-10-31, the Captain: travel times for the morning briefing with no cloud service and no paid API).
#
# Deployed with the rest of the stack when /etc/skippy-core/core.env says CORE_ROUTES=1 (core/install/routes.sh sets it and opens the
# tailnet door). The simulator and CI leave it out: the first start downloads OpenStreetMap's California extract (~1.3 GB) twice and
# builds from it for about an hour.
#
#   valhalla   the router (pinned): builds its road tiles from the extract on first start, then serves distance and drive time
#              (no live traffic). Its tiles are kept in a named volume (rebuilt from the map, so not worth a backup of CORE_STATE).
#   nominatim  the geocoder (pinned): imports the extract into its own Postgres on first start, then turns an address into a position.
#              Named volume, same reason. Memory is capped (and kept out of swap): the box has
#              ~10 GB beside the resident models, so the first import is slow (an hour or two) rather than greedy.
#   routes     core/routes: one small JSON door on 7354 (tailnet only, through `tailscale serve`) with the readiness contract.
#
# No Docker health checks on the two engines on purpose: the deploy waits (--wait) for health, and the first import takes an hour.
# routes' own check only asks that it answers; /health says 503 (not ready, and why) until both engines are up.
x-logging: &routes-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1@sha256:6238809f9dc3057743d70a20efd3911ec38e458bfa13a0601909b58f68dfd956
    restart: unless-stopped
    logging: *routes-logging
    environment:
      - tile_urls=https://download.geofabrik.de/north-america/us/california-latest.osm.pbf
      - serve_tiles=True
      - build_admins=True
      - build_time_zones=True
      - build_elevation=False
      - build_transit=False
      - use_tiles_ignore_pbf=True        # tiles built once are kept; a new map is a deliberate rebuild (force_rebuild=True once)
      - server_threads=2                 # also the tile build's concurrency: fewer threads, less memory beside the models
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
      - routes-valhalla:/custom_files

  nominatim:
    image: mediagis/nominatim:5.1@sha256:e07824605225985e74433e5b3d5e07b077e3aec868e48af18a7ee79025475db7
    restart: unless-stopped
    logging: *routes-logging
    environment:
      - PBF_URL=https://download.geofabrik.de/north-america/us/california-latest.osm.pbf
      - IMPORT_STYLE=full
      - THREADS=4
      - NOMINATIM_PASSWORD=nominatim-internal     # Postgres inside this container only; no port is published
      - POSTGRES_SHARED_BUFFERS=512MB
      - POSTGRES_MAINTENANCE_WORK_MEM=512MB
      - POSTGRES_AUTOVACUUM_WORK_MEM=256MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=4GB
    shm_size: 1g
    mem_limit: 6g                       # osm2pgsql's cache is 2x the extract (~2.6 GB, Nominatim's own rule) + Postgres
    memswap_limit: 6g
    volumes:
      - routes-nominatim:/var/lib/postgresql/16/main

  routes:
    build: ./routes
    restart: unless-stopped
    logging: *routes-logging
    environment:
      - VALHALLA_URL=http://valhalla:8002
      - NOMINATIM_URL=http://nominatim:8080
    ports:
      - "127.0.0.1:7354:7354"

volumes:
  routes-valhalla:
  routes-nominatim:
