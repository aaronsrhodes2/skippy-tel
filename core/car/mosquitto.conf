# The broker between TeslaMate and the car reader (core/compose.tesla.yml). Inside the stack's own network only, so no auth.
# persistence: TeslaMate publishes each value retained but only when it changes, so a broker that forgot them on a restart left
# the car reader blank until the car next changed (2026-10-26). Kept in ${CORE_STATE}/tesla/mosquitto.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
