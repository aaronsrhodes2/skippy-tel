# SkippyCore's stack (the Bosgame M5; the simulator and CI run the same file with stand-in models on CPU).
# Deployed by core/deployer/deployer.py as: docker compose -p skippycore -f core/compose.core.yml [-f core/compose.gpu.yml] up
# Nothing here names a Windows drive or an NVIDIA device: paths come from the deployer's environment
# (/etc/skippy-core/core.env), and the GPU is the iGPU through /dev/dri (compose.gpu.yml, the box only).
#
#   llm      llama-swap + llama.cpp (Vulkan build): one llama-server per slot, swapped on demand. Config is rendered by
#            core/llm/models.py into ${CORE_STATE}/llm (config.yaml + shim.json) before every deploy.
#   ollama   the Ollama shim (core/ollama-shim): same name and port as today's Ollama, so OLLAMA_BASE_URL never changes.
#   flask-api  Skippy's core, unchanged code.
#   mentat   the physics engine with Core's chat model (skippy-pc's reporter and wa-trickle call it on the tailnet, :7348).
#   image-studio  the portal chat's pictures: Qwen-Image-2512 through stable-diffusion.cpp (Vulkan), one sd-cli run per
#            picture so it holds no memory between them. Host networking on 7347 so the box's ufw (not Docker's own NAT)
#            keeps the LAN out; the tailnet gets in through Tailscale's own rules, and ALLOW_FROM narrows it to skippy-pc.
# Later stages (docs/local-ai-fallback-plan.md Phase 5): the home reporter, the gates, Dozzle.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  llm:
    image: ghcr.io/mostlygeek/llama-swap:v265-vulkan-b11641@sha256:7a1d92c796dadb96fee7deac9ba41d46a2e0f50dabc6578f88f2d8fd21878110
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/app/llama-swap"]
    command: ["-config", "/config/config.yaml", "-listen", ":8080", "-watch-config"]
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}   # the rendered config says apiKeys: ${env.LLM_API_KEY} when the deployer has one
    ports:
      - "127.0.0.1:8080:8080"     # the box's own tools, and Tailscale Funnel (core/install/funnel.sh) with the key
    volumes:
      - ${MODELS_ROOT:-/srv/models}:/models:ro
      - ${CORE_STATE:-/var/lib/skippy-core}/llm:/config:ro

  ollama:
    build: ./ollama-shim
    restart: unless-stopped
    logging: *default-logging
    environment:
      - LLM_URL=http://llm:8080
      - SHIM_NAMES=/config/shim.json
      - LLM_API_KEY=${LLM_API_KEY:-}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${CORE_STATE:-/var/lib/skippy-core}/llm:/config:ro
    depends_on:
      - llm

  flask-api:
    build: ../services/flask-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3003:5000"
    env_file: ${CORE_VAULT_ENV:-/etc/skippy-core/vault.env}
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
    volumes:
      - ${CORE_STATE:-/var/lib/skippy-core}/flask-api:/app/state:rw
      - ${CORE_STATE:-/var/lib/skippy-core}/drive-state:/drive-state:rw   # photo tags, Drive tokens (skippy-pc: ../music-collection/state)
      - ${MUSIC_ROOT:-/srv/music}:/music:ro
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Mentat with Core's chat model (2026-10-25; it was mentat-home on skippy-pc): sigma-ground's physics engine, its trained router first
  # and its translator asking the shim's skippy-chat (Qwen3.6-35B-A3B, resident) for phrasings its keywords miss. The tailnet reaches it through
  # `tailscale serve --http=7348` (core/install/tailnet.sh); the port itself is on 127.0.0.1 only.
  mentat:
    build:
      context: ..
      dockerfile: mentat/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    environment:
      - MENTAT_USE_LLM=1
      - OLLAMA_URL=http://ollama:11434
      - MATERIA_OLLAMA_MODEL=skippy-chat    # the translator's Qwen: the chat slot (Qwen3.6-35B-A3B), resident
      - MENTAT_ROUTER_MODEL=${MENTAT_ROUTER_MODEL-mentat-router-v31-4b}   # the trained router stage in /ask (mentat/router_stage.py), resident; empty = off
      - MENTAT_ROUTER_MODEL=mentat-router-v31-4b   # the trained router leads /ask (mentat/router_stage.py); the shim serves it on this box
      - MENTAT_CALL_TIMEOUT=90
      - MENTAT_RATE_PER_MIN=600
      - MENTAT_INSTANCE=home
      - MENTAT_RESEARCH_DIR=/research
    ports:
      - "127.0.0.1:7348:8080"
    volumes:
      - ${CORE_STATE:-/var/lib/skippy-core}/mentat-research:/research   # <YYYY-MM>.jsonl, appended forever (mentat/research.py)
    command: gunicorn --bind 0.0.0.0:8080 --workers 1 --threads 4 --timeout 120 app:app
    depends_on:
      - ollama

  image-studio:
    build: ./image-studio
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    environment:
      - PORT=7347
      - MODELS=/models
      - ALLOW_FROM=${IMAGE_STUDIO_ALLOW_FROM:-127.0.0.1,100.122.71.14}   # the box itself, and skippy-pc on the tailnet
    volumes:
      - ${MODELS_ROOT:-/srv/models}:/models:ro
