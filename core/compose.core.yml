# SkippyCore's stack (the Bosgame M5; the simulator and CI run the same file with stand-in models on CPU).
# Deployed by core/deployer/deployer.py as: docker compose -p skippycore -f core/compose.core.yml [-f core/compose.gpu.yml] up
# Nothing here names a Windows drive or an NVIDIA device: paths come from the deployer's environment
# (/etc/skippy-core/core.env), and the GPU is the iGPU through /dev/dri (compose.gpu.yml, the box only).
#
#   llm      llama-swap + llama.cpp (Vulkan build): one llama-server per slot, swapped on demand. Config is rendered by
#            core/llm/models.py into ${CORE_STATE}/llm (config.yaml + shim.json) before every deploy.
#   ollama   the Ollama shim (core/ollama-shim): same name and port as today's Ollama, so OLLAMA_BASE_URL never changes.
#   flask-api  Skippy's core, unchanged code.
# Later stages (docs/local-ai-fallback-plan.md Phase 5): the home reporter, Mentat, the gates, Dozzle, Kuma.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  llm:
    image: ghcr.io/mostlygeek/llama-swap:v265-vulkan-b11641@sha256:7a1d92c796dadb96fee7deac9ba41d46a2e0f50dabc6578f88f2d8fd21878110
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["/app/llama-swap"]
    command: ["-config", "/config/config.yaml", "-listen", ":8080", "-watch-config"]
    ports:
      - "127.0.0.1:8080:8080"     # the smoke test and the box's own tools; tailnet access comes with an --api-key
    volumes:
      - ${MODELS_ROOT:-/srv/models}:/models:ro
      - ${CORE_STATE:-/var/lib/skippy-core}/llm:/config:ro

  ollama:
    build: ./ollama-shim
    restart: unless-stopped
    logging: *default-logging
    environment:
      - LLM_URL=http://llm:8080
      - SHIM_NAMES=/config/shim.json
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ${CORE_STATE:-/var/lib/skippy-core}/llm:/config:ro
    depends_on:
      - llm

  flask-api:
    build: ../services/flask-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3003:5000"
    env_file: ${CORE_VAULT_ENV:-/etc/skippy-core/vault.env}
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
    volumes:
      - ${CORE_STATE:-/var/lib/skippy-core}/flask-api:/app/state:rw
      - ${CORE_STATE:-/var/lib/skippy-core}/drive-state:/drive-state:rw   # photo tags, Drive tokens (skippy-pc: ../music-collection/state)
      - ${MUSIC_ROOT:-/srv/music}:/music:ro
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
