# Skippy's room box: the Waveshare ESP32-S3 Smart 86 Box (ESP32-S3-Touch-LCD-4B). A DUMB terminal: it hears, it plays, it shows a light.
# Everything that thinks lives on skippy-pc (services/satellite/hub.py): the wake word, Whisper, the brain, Skippy's voice, the house, the music.
#
#   bash rooms/flash.sh kitchen "Kitchen"        (first time over USB-C; after that over Wi-Fi)
#
# What the box does by itself, only because doing it here is faster than asking skippy-pc:
#   * streams the microphone (16 kHz, cleaned by its own noise suppression and auto gain) to the hub whenever the hub is connected;
#   * plays whatever URL the hub hands it (Skippy's voice as an announcement over the music, Bilby's tracks as media), ducking the music
#     under the voice itself, with no round trip;
#   * the volume keys change the volume at once;
#   * the ring shows what is happening the moment it happens (listening, thinking, speaking, music).
# A tap on the screen is reported to the hub as "Skippy" (the hub decides what it means).
#
# Hardware facts (I2S pins, codecs, expander, the ST7701S init) are from Matthieu Boulord's MIT-licensed config for this board:
# github.com/MatthieuBoulord/ESP32-S3-Touch-LCD-4B-ESPHome-Home-Assistant-Voice-Satellite (smart86.yaml). The mics and the speaker share one
# I2S bus, so `full_duplex` (ESPHome 2026.11; flash.sh pins the dev commit until it ships) is what lets it hear "Skippy, pause" over the music.
# The voice assistant needs a 16 kHz microphone and duplex needs the speaker at the same rate: music is 16 kHz mono, which is about what
# this small speaker can reproduce anyway.

packages:
  avatar: !include avatar/skippy-avatar.yaml   # every frame as an image (merged into the image list)

substitutions:
  name: skippy-room
  room: "Room"

esphome:
  name: ${name}
  friendly_name: Skippy ${room}
  min_version: 2026.11.0-dev
  build_flags:
    - -DLV_USE_SNAPSHOT=1                 # lv_snapshot_take, for the screenshot action
  on_boot:
    - priority: 200
      then:
        - lambda: |-
            // The ST7701S panel is initialised by bit-banging its SPI through the TCA9554 expander (CS=EXIO0, MOSI=EXIO1, CLK=EXIO2)
            id(lcd_spi_clk)->setup();
            id(lcd_spi_mosi)->setup();
            id(lcd_spi_cs)->setup();
            id(lcd_spi_cs)->digital_write(true);
            auto spi_write = [](bool is_data, uint8_t byte) {
              id(lcd_spi_cs)->digital_write(false);
              id(lcd_spi_mosi)->digital_write(is_data);
              id(lcd_spi_clk)->digital_write(true);
              id(lcd_spi_clk)->digital_write(false);
              for (int i = 7; i >= 0; i--) {
                id(lcd_spi_mosi)->digital_write((byte >> i) & 1);
                id(lcd_spi_clk)->digital_write(true);
                id(lcd_spi_clk)->digital_write(false);
              }
              id(lcd_spi_cs)->digital_write(true);
            };
            auto cmd = [&](uint8_t c) { spi_write(false, c); };
            auto dat = [&](uint8_t d) { spi_write(true, d); };
            cmd(0x11); delay(120);
            cmd(0xFF); dat(0x77); dat(0x01); dat(0x00); dat(0x00); dat(0x10);
            cmd(0xC0); dat(0x3B); dat(0x00);
            cmd(0xC1); dat(0x0D); dat(0x02);
            cmd(0xC2); dat(0x21); dat(0x08);
            cmd(0xCD); dat(0x08);
            cmd(0xB0); dat(0x00); dat(0x11); dat(0x18); dat(0x0E); dat(0x11); dat(0x06); dat(0x07); dat(0x08); dat(0x07); dat(0x22); dat(0x04); dat(0x12); dat(0x0F); dat(0xAA); dat(0x31); dat(0x18);
            cmd(0xB1); dat(0x00); dat(0x11); dat(0x19); dat(0x0E); dat(0x12); dat(0x07); dat(0x08); dat(0x08); dat(0x08); dat(0x22); dat(0x04); dat(0x11); dat(0x11); dat(0xA9); dat(0x32); dat(0x18);
            cmd(0xFF); dat(0x77); dat(0x01); dat(0x00); dat(0x00); dat(0x11);
            cmd(0xB0); dat(0x60);
            cmd(0xB1); dat(0x30);
            cmd(0xB2); dat(0x87);
            cmd(0xB3); dat(0x80);
            cmd(0xB5); dat(0x49);
            cmd(0xB7); dat(0x85);
            cmd(0xB8); dat(0x21);
            cmd(0xC1); dat(0x78);
            cmd(0xC2); dat(0x78); delay(20);
            cmd(0xE0); dat(0x00); dat(0x1B); dat(0x02);
            cmd(0xE1); dat(0x08); dat(0xA0); dat(0x00); dat(0x00); dat(0x07); dat(0xA0); dat(0x00); dat(0x00); dat(0x00); dat(0x44); dat(0x44);
            cmd(0xE2); dat(0x11); dat(0x11); dat(0x44); dat(0x44); dat(0xED); dat(0xA0); dat(0x00); dat(0x00); dat(0xEC); dat(0xA0); dat(0x00); dat(0x00);
            cmd(0xE3); dat(0x00); dat(0x00); dat(0x11); dat(0x11);
            cmd(0xE4); dat(0x44); dat(0x44);
            cmd(0xE5); dat(0x0A); dat(0xE9); dat(0xD8); dat(0xA0); dat(0x0C); dat(0xEB); dat(0xD8); dat(0xA0); dat(0x0E); dat(0xED); dat(0xD8); dat(0xA0); dat(0x10); dat(0xEF); dat(0xD8); dat(0xA0);
            cmd(0xE6); dat(0x00); dat(0x00); dat(0x11); dat(0x11);
            cmd(0xE7); dat(0x44); dat(0x44);
            cmd(0xE8); dat(0x09); dat(0xE8); dat(0xD8); dat(0xA0); dat(0x0B); dat(0xEA); dat(0xD8); dat(0xA0); dat(0x0D); dat(0xEC); dat(0xD8); dat(0xA0); dat(0x0F); dat(0xEE); dat(0xD8); dat(0xA0);
            cmd(0xEB); dat(0x02); dat(0x00); dat(0xE4); dat(0xE4); dat(0x88); dat(0x00); dat(0x40);
            cmd(0xEC); dat(0x3C); dat(0x00);
            cmd(0xED); dat(0xAB); dat(0x89); dat(0x76); dat(0x54); dat(0x02); dat(0xFF); dat(0xFF); dat(0xFF); dat(0xFF); dat(0xFF); dat(0xFF); dat(0x20); dat(0x45); dat(0x67); dat(0x98); dat(0xBA);
            cmd(0xFF); dat(0x77); dat(0x01); dat(0x00); dat(0x00); dat(0x00);
            cmd(0x36); dat(0x00);
            cmd(0x3A); dat(0x66);
            cmd(0x21); delay(120);
            cmd(0x29);
        - light.turn_on:
            id: backlight
            brightness: 70%
    - priority: -200
      then:
        - output.turn_on: speaker_amp
        - script.execute:
            id: face
            state: idle

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

http_request:                             # only to bring in the HTTP client the screenshot action posts with

api:
  encryption:
    key: !secret skippy_room_api_key      # the same key in the vault .env as SATELLITE_ESPHOME_KEY: the hub is the only client
  actions:
    - action: screenshot                  # what the screen shows now, as raw RGB565 posted to `url` (tools/ ... rooms/shot.py asks for it and makes the PNG)
      variables:
        url: string
      then:
        - lambda: |-
            lv_draw_buf_t *snap = lv_snapshot_take(lv_screen_active(), LV_COLOR_FORMAT_RGB565);
            if (snap == nullptr) { ESP_LOGE("shot", "snapshot failed (no memory?)"); return; }
            esp_http_client_config_t cfg = {};
            cfg.url = url.c_str();
            cfg.method = HTTP_METHOD_POST;
            cfg.timeout_ms = 15000;
            esp_http_client_handle_t h = esp_http_client_init(&cfg);
            char dims[24]; snprintf(dims, sizeof dims, "%d,%d,%d", (int) snap->header.w, (int) snap->header.h, (int) snap->header.stride);
            esp_http_client_set_header(h, "X-Dims", dims);
            esp_http_client_set_post_field(h, (const char *) snap->data, snap->data_size);
            esp_err_t e = esp_http_client_perform(h);
            ESP_LOGI("shot", "sent %u bytes: %s", (unsigned) snap->data_size, esp_err_to_name(e));
            esp_http_client_cleanup(h);
            lv_draw_buf_destroy(snap);

ota:
  - platform: esphome
    password: !secret skippy_room_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none                   # a voice terminal must never doze (the Theater Fan lesson)
  ap:
    ssid: Skippy ${room} setup
    password: !secret skippy_room_ota_password

captive_portal:

# ── the buses ──────────────────────────────────────────────────────────────────────────────────────────────
i2c:
  - id: bus_a
    sda: GPIO47
    scl: GPIO48
    frequency: 100kHz

pca9554:
  - id: expander
    i2c_id: bus_a
    address: 0x20

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO16
    i2s_mclk_pin: GPIO5
    full_duplex: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 33db

output:
  - platform: gpio
    id: speaker_amp
    pin:
      pca9554: expander
      number: 3
      mode:
        output: true
  - platform: ledc
    id: backlight_pwm
    pin: GPIO4
    frequency: 5000Hz
    inverted: true

# ── ears and mouth ─────────────────────────────────────────────────────────────────────────────────────────
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO6
    dac_type: external
    audio_dac: es8311_dac
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 100ms
  - platform: mixer
    id: room_mixer
    output_speaker: i2s_speaker
    num_channels: 1
    source_speakers:
      - id: voice_in
        timeout: never
      - id: music_in
        timeout: never
  - platform: resampler
    id: voice_resampler
    output_speaker: voice_in
  - platform: resampler
    id: music_resampler
    output_speaker: music_in

audio:                                    # since ESPHome 2026.10 every decoder is opt-in: without mp3 the box refuses Skippy's voice (ESP_ERR_NOT_SUPPORTED)
  codecs:
    mp3:                                  # Skippy's voice (the voice gate's TTS)
    wav:                                  # the machine's own voice, when the gate can't speak
    flac:                                 # Bilby's tracks (the hub's media server transcodes to 16 kHz FLAC)

media_player:
  - platform: speaker
    id: player
    name: Speaker
    volume_initial: 0.4                   # 0.6 was loud in the Office; the side keys go up from here
    announcement_pipeline:                # Skippy's voice and announcements: over the music, which ducks under it
      speaker: voice_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 16000
    media_pipeline:                       # Bilby's tracks
      speaker: music_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 16000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: music_in
          decibel_reduction: 20
          duration: 0.2s
    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing: player
          then:
            - mixer_speaker.apply_ducking:
                id: music_in
                decibel_reduction: 0
                duration: 1.0s
            - lambda: |-
                id(talking) = false;
                id(mouth_env) = "";
          else:                                # Skippy is speaking: the mouth moves
            - lambda: |-
                if (!id(talking)) id(talk_t0) = millis();
                id(talking) = true;
    on_play:
      - script.execute:
          id: face
          state: music
    on_idle:
      - script.execute:
          id: face
          state: idle

voice_assistant:
  id: va
  microphone: mic
  media_player: player
  use_wake_word: true                     # the hub hears "Skippy" (its trained model): the box just streams while the hub is connected
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - if:
        condition:
          switch.is_on: mic_on
        then:
          - voice_assistant.start_continuous:
  on_client_disconnected:
    - voice_assistant.stop:
    - script.execute:
        id: face
        state: offline
  on_wake_word_detected:
    - lvgl.label.update:
        id: heard_label
        text: ""
    - lvgl.label.update:
        id: subtitle_label
        text: ""
    - script.execute:
        id: face
        state: listening
  on_listening:
    - script.execute:
        id: face
        state: listening
  on_stt_vad_start:                       # the box is recording your voice
    - script.execute:
        id: face
        state: recording
  on_stt_vad_end:
    - script.execute:
        id: face
        state: thinking
  on_stt_end:                             # what Whisper heard you say
    - lvgl.label.update:
        id: heard_label
        text: !lambda |-
          static std::string quoted;
          quoted = "\"" + x + "\"";
          return quoted.c_str();
  on_tts_start:                           # and what Skippy says back
    - lvgl.label.update:
        id: subtitle_label
        text: !lambda return x.c_str();
    - script.execute:
        id: face
        state: speaking
  on_end:
    - script.execute:
        id: face
        state: idle
  on_error:
    - script.execute:
        id: face
        state: idle

switch:
  - platform: template
    id: mic_on
    name: Microphone
    icon: mdi:microphone
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - voice_assistant.start_continuous:
    on_turn_off:
      - voice_assistant.stop:
      - script.execute:
          id: face
          state: muted

# What the hub wants shown under the ring: now playing, or what Skippy just said. The hub writes it; the box only displays it.
text:
  - platform: template                    # the hub says a conversation is open (the name opened it; a goodbye or a long silence closes it)
    id: session_text
    name: Session
    mode: text
    max_length: 4
    optimistic: true
    on_value:
      - lambda: |-
          id(in_session) = (x == "1");
          if (id(state_now) == "idle" || id(state_now).empty())
            lv_label_set_text(id(status_label), id(in_session) ? "listening" : "say \"Skippy\"");
  - platform: template                    # how loud each 60 ms of Skippy's next clip is (digits 0-9), written by the hub so the mouth follows the words
    id: mouth_env_text
    name: Mouth
    mode: text
    max_length: 255
    optimistic: true
    internal: false
    on_value:
      - lambda: |-
          id(mouth_env) = x;
  - platform: template
    id: subtitle
    name: Subtitle
    mode: text
    max_length: 120
    optimistic: true
    on_value:
      - lvgl.label.update:
          id: subtitle_label
          text: !lambda return x;

binary_sensor:
  - platform: template                    # a tap on the screen: the hub treats it as "Skippy"
    id: tapped
    name: Tap
  - platform: gpio
    id: key_down
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - media_player.volume_down: player
  - platform: gpio
    id: key_up
    pin:
      pca9554: expander
      number: 4
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      - media_player.volume_up: player

# ── the face: one ring that breathes, coloured by what is happening ───────────────────────────────────────
globals:
  - id: face_rgb
    type: uint32_t
    initial_value: '0x6a28c9'
  - id: in_session
    type: bool
    initial_value: 'false'
  - id: talking
    type: bool
    initial_value: 'false'
  - id: mouth_env
    type: std::string
  - id: talk_t0
    type: uint32_t
    initial_value: '0'
  - id: state_now
    type: std::string
  - id: energy
    type: float
    initial_value: '0.3'
  - id: energy_target
    type: float
    initial_value: '0.3'
  - id: breath
    type: int
    initial_value: '0'
  - id: last_activity
    type: uint32_t
    initial_value: '0'

script:
  - id: face
    mode: restart
    parameters:
      state: string
    then:
      - lambda: |-
          // the nimbus and the line above the head say what the box is doing. idle: purple, breathing; listening (your name was heard): cyan;
          // recording your voice: red; thinking: amber; speaking: Skippy purple; music: green; muted: red; offline: grey
          uint32_t c = 0x6a28c9; const char *t = id(in_session) ? "listening" : "say \"Skippy\""; float en = id(in_session) ? 0.6f : 0.3f;
          if (state == "listening") { c = 0x22d3ee; t = "listening"; en = 1.0f; }
          else if (state == "recording") { c = 0xff3b6b; t = "recording"; en = 1.4f; }
          else if (state == "thinking") { c = 0xf59e0b; t = "thinking"; en = 1.6f; }
          else if (state == "speaking") { c = 0xb05cff; t = "speaking"; en = 1.0f; }
          else if (state == "music") { c = 0x22c55e; t = "playing"; en = 0.6f; }
          else if (state == "muted") { c = 0xef4444; t = "microphone off"; en = 0.2f; }
          else if (state == "offline") { c = 0x475569; t = "hub offline"; en = 0.1f; }
          id(face_rgb) = c;
          id(state_now) = state;
          id(energy_target) = en;
          lv_obj_t *n[4] = {id(nim_1), id(nim_2), id(nim_3), id(nim_4)};
          for (int i = 0; i < 4; i++) lv_obj_set_style_border_color(n[i], lv_color_hex(c), LV_PART_MAIN);
          lv_label_set_text(id(status_label), t);
          lv_obj_set_style_text_color(id(status_label), lv_color_hex(c == 0x6a28c9 ? 0xb05cff : c), LV_PART_MAIN);
          if (state != "idle" && state != "offline") id(last_activity) = millis();
      - if:
          condition:
            lambda: 'return state != "idle" && state != "offline";'
          then:
            - light.turn_on:
                id: backlight
                brightness: 70%

interval:
  - interval: 60ms                        # the lamp breathes: slow when idle, quicker when something is happening
    then:
      - lambda: |-
          bool busy = id(face_rgb) != 0x6a28c9 && id(face_rgb) != 0x475569;
          id(breath) = (id(breath) + (busy ? 6 : 2)) % 360;
          float s = (sinf(id(breath) * 3.14159f / 180.0f) + 1.0f) / 2.0f;
          float k = busy ? 0.65f + 0.35f * s : 0.45f + 0.35f * s;
          static const int base[4] = {230, 150, 90, 45};
          lv_obj_t *n[4] = {id(nim_1), id(nim_2), id(nim_3), id(nim_4)};
          for (int i = 0; i < 4; i++) lv_obj_set_style_border_opa(n[i], (lv_opa_t)(base[i] * k), LV_PART_MAIN);
  - interval: 50ms                        # Skippy's wireframe face: a neon globe with eyes, brows and a mouth that follow his state, his mood and his words
    then:
      - lambda: |-
          // ── what the face is doing: targets, eased toward every tick ──
          static float ph = 0, rot = 0, eo = 1, bh = 0, ba = 0, bl = 0, br = 0, lx = 0, ly = 0, sm = 0, mw = 22, mu = 0.5f, ml = 0.5f, teethv = 0;
          static uint32_t blink_at = 0, glance_at = 0; static float gx = 0, gy = 0;
          const std::string &st = id(state_now);
          bool talk = id(talking);
          uint32_t now = millis();
          // mouth shape: Rhubarb's letters (or loudness digits) by elapsed time; the first character is the mood (n h a s q d)
          char mood = 'n', vis = 'X';
          const std::string &env = id(mouth_env);
          if (talk) {
            size_t i = (now - id(talk_t0)) / 60 + 1;
            if (!env.empty() && env[0] >= 'a' && env[0] <= 'z') mood = env[0];
            if (i < env.size()) vis = env[i];
            else vis = "BCDBCEA"[(now / 90) % 7];                    // no cues for this moment: he just talks
            if (vis >= '0' && vis <= '9') vis = vis == '0' ? 'X' : (vis < '3' ? 'B' : (vis < '6' ? 'C' : 'D'));
          }
          struct M { char c; float w, u, l, teeth; };
          static const M ms[] = {{'X', 22, 0.6f, 0.6f, 0}, {'A', 22, 0.3f, 0.3f, 0}, {'B', 24, 3, 3, 1}, {'C', 24, 8, 8, 1}, {'D', 26, 13, 17, 1},
                                 {'E', 15, 10, 10, 0}, {'F', 10, 7, 7, 0}, {'G', 24, 3, 5, 1}, {'H', 20, 6, 6, 0}};
          float tw = 22, tu = 0.6f, tl = 0.6f, tt = 0;
          for (const M &m : ms) if (m.c == vis) { tw = m.w; tu = m.u; tl = m.l; tt = m.teeth; }
          // expression: eyes open (1 = normal), brow height and slant (positive: angry), where he looks, the smile
          float t_eo = 1, t_bh = 0, t_ba = 0, t_bl = 0, t_br = 0, t_lx = 0, t_ly = 0, t_sm = 3;
          if (st == "listening") { t_eo = 1.25f; t_bh = 10; t_sm = 4; }
          else if (st == "recording") { t_eo = 1.3f; t_bh = 14; t_sm = 1; }
          else if (st == "thinking") { t_eo = 0.9f; t_bl = 10; t_ba = 0.15f; t_lx = -0.8f + 0.2f * sinf(ph * 0.7f); t_ly = -0.8f; t_sm = -2; }
          else if (st == "music") { t_eo = 0.55f; t_bh = 4; t_sm = 9; }
          else if (st == "muted") { t_eo = 0.08f; t_sm = 0; }
          else if (st == "offline") { t_eo = 0.2f; t_sm = -3; }
          else if (st == "speaking" || talk) {
            t_sm = 4; t_bh = 3 + 5 * (vis == 'D' || vis == 'C');         // brows bounce on the open sounds
            if (mood == 'h') { t_eo = 0.75f; t_sm = 11; t_bh = 7; }
            else if (mood == 'a') { t_eo = 0.8f; t_ba = 0.4f; t_sm = 3; t_br = -4; }
            else if (mood == 's') { t_eo = 1.4f; t_bh = 14; }
            else if (mood == 'q') { t_bl = 11; t_ba = -0.1f; t_sm = 2; t_ly = -0.3f; }
            else if (mood == 'd') { t_sm = -6; t_ba = -0.35f; t_eo = 0.85f; t_bh = 2; }
          } else {                                                     // idle: looks around now and then
            if (now > glance_at) { gx = ((random_uint32() % 100) / 50.0f - 1) * 0.6f; gy = ((random_uint32() % 100) / 50.0f - 1) * 0.3f; glance_at = now + 1500 + random_uint32() % 3500; }
            t_lx = gx; t_ly = gy;
          }
          if (now > blink_at) { blink_at = now + 2500 + random_uint32() % 3500; ph += 0; id(breath) = id(breath); bl = 0; }
          float blinking = (now + 150 > blink_at && now < blink_at) ? 0.1f : 1.0f;   // a blink: the 150 ms before each stamp
          const float e = 0.35f;
          eo += (t_eo - eo) * 0.3f; bh += (t_bh - bh) * e; ba += (t_ba - ba) * e; bl += (t_bl - bl) * e; br += (t_br - br) * e;
          lx += (t_lx - lx) * 0.25f; ly += (t_ly - ly) * 0.25f; sm += (t_sm - sm) * 0.3f;
          mw += (tw - mw) * 0.55f; mu += (tu - mu) * 0.55f; ml += (tl - ml) * 0.55f; teethv += (tt - teethv) * 0.5f;
          ph += talk ? 0.13f : 0.06f; rot += 0.012f * (0.6f + id(energy));
          float ox = sinf(ph * 0.5f) * 5, oy = sinf(ph) * 5, cx = 240 + ox, cy = 215 + oy;
          auto clampi = [](float v) { int i = (int) v; return i < 0 ? 0 : (i > 479 ? 479 : i); };
          static lv_point_precise_t el[28], er[28], bl_[4], br_[4], mo[37], th[2], mf[40];
          // ── eyes ──
          auto eye = [&](lv_point_precise_t *p, float ex, float ey) {
            float w = 25, h = 22 * eo * blinking; if (h < 2) h = 2;
            for (int i = 0; i < 28; i++) { float a = i * 6.2832f / 27; p[i].x = clampi(ex + w * cosf(a)); p[i].y = clampi(ey + h * sinf(a)); }
          };
          float exl = cx - 52, exr = cx + 52, ey = cy - 36;
          eye(el, exl, ey); eye(er, exr, ey);
          lv_line_set_points(id(eye_l)->obj, el, 28); lv_line_set_points(id(eye_r)->obj, er, 28);
          bool open = eo * blinking > 0.3f;
          for (int s2 = 0; s2 < 2; s2++) {
            lv_obj_t *pu = s2 ? id(pup_r) : id(pup_l);
            if (open) { lv_obj_clear_flag(pu, LV_OBJ_FLAG_HIDDEN); lv_obj_set_pos(pu, (int) ((s2 ? exr : exl) + lx * 12 - 7), (int) (ey + ly * 8 - 7)); lv_obj_t *gl = s2 ? id(glint_r) : id(glint_l); lv_obj_clear_flag(gl, LV_OBJ_FLAG_HIDDEN); lv_obj_set_pos(gl, (int) ((s2 ? exr : exl) + lx * 12 - 1), (int) (ey + ly * 8 - 7)); }
            else { lv_obj_add_flag(pu, LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(s2 ? id(glint_r) : id(glint_l), LV_OBJ_FLAG_HIDDEN); }
          }
          // ── brows ──
          auto brow = [&](lv_point_precise_t *p, float bx, float side, float extra) {
            float y0 = cy - 36 - 36 * eo * 0.45f - 14 - bh - extra, sl = ba * 18 * side;     // side -1 left, +1 right: inner end lower when angry
            p[0].x = clampi(bx - 26); p[0].y = clampi(y0 - sl * -1 * (side < 0 ? 1 : -1) * 0 + (side < 0 ? sl : -sl) * -1);
            p[1].x = clampi(bx - 9);  p[1].y = clampi(y0 + (side < 0 ? -sl : sl) * 0.3f - 3);
            p[2].x = clampi(bx + 9);  p[2].y = clampi(y0 + (side < 0 ? sl : -sl) * 0.3f - 3);
            p[3].x = clampi(bx + 26); p[3].y = clampi(y0 + (side < 0 ? sl : -sl) * -1 * -1);
          };
          brow(bl_, exl, -1, bl + (br < 0 ? 0 : 0)); brow(br_, exr, 1, br + 0);
          lv_line_set_points(id(brow_l)->obj, bl_, 4); lv_line_set_points(id(brow_r)->obj, br_, 4);
          // ── mouth: an upper and a lower lip meeting at the corners; the smile lifts them ──
          float my = cy + 52;
          for (int i = 0; i < 18; i++) {                                // upper lip, left to right
            float u = -1 + i * 2.0f / 17, edge = 1 - u * u;
            mo[i].x = clampi(cx + mw * u); mo[i].y = clampi(my - mu * edge - sm * (1 - edge) * 0.5f);
          }
          for (int i = 0; i < 18; i++) {                                // lower lip, right to left
            float u = 1 - i * 2.0f / 17, edge = 1 - u * u;
            mo[18 + i].x = clampi(cx + mw * u); mo[18 + i].y = clampi(my + ml * edge - sm * (1 - edge) * 0.5f);
          }
          mo[36] = mo[0];
          lv_line_set_points(id(mouth)->obj, mo, 37);
          int nf = 0;                                                    // the inside of the mouth: scan lines between the lips, one polyline
          if (mu + ml > 3) {
            float top = my - mu, bot = my + ml; bool ltr = true;
            for (float yy = top + 1.5f; yy < bot - 1 && nf < 38; yy += 3.5f) {
              float v = (yy - my) < 0 ? (my - yy) / mu : (yy - my) / ml; if (v > 1) v = 1;
              float half = mw * sqrtf(1 - v * v) * 0.97f;
              mf[nf].x = clampi(cx + (ltr ? -half : half)); mf[nf].y = clampi(yy); nf++;
              mf[nf].x = clampi(cx + (ltr ? half : -half)); mf[nf].y = clampi(yy); nf++;
              ltr = !ltr;
            }
          }
          if (nf >= 2) { lv_line_set_points(id(mfill)->obj, mf, nf); lv_obj_set_style_line_opa(id(mfill)->obj, 255, LV_PART_MAIN); }
          else lv_obj_set_style_line_opa(id(mfill)->obj, 0, LV_PART_MAIN);
          th[0].x = clampi(cx - mw * 0.7f); th[0].y = clampi(my - mu * 0.35f); th[1].x = clampi(cx + mw * 0.7f); th[1].y = th[0].y;
          lv_line_set_points(id(teeth)->obj, th, 2);
          lv_obj_set_style_line_opa(id(teeth)->obj, (lv_opa_t) (teethv > 0.5f && mu + ml > 6 ? 150 : 0), LV_PART_MAIN);
  - interval: 80ms                        # the swirling background: three neon spirals drifting, quicker and brighter the busier he is
    then:
      - lambda: |-
          static float t = 0; static lv_point_precise_t pts[3][40];
          id(energy) += (id(energy_target) - id(energy)) * 0.1f;
          float e = id(energy);
          t += 0.08f * (0.5f + 0.8f * e);
          lv_obj_t *o[3] = {id(sp_a)->obj, id(sp_b)->obj, id(sp_c)->obj};
          for (int k = 0; k < 3; k++) {
            float f1 = 0.05f + 0.03f * k, f2 = 0.07f + 0.02f * k;
            float cx = 240 + sinf(t * f1 * 3.0f + k * 2.1f) * 120 + sinf(t * f2 * 7.0f + k) * 40;
            float cy = 240 + sinf(t * f2 * 3.0f + k * 1.3f) * 120 + sinf(t * f1 * 6.0f + k * 0.7f) * 40;
            float R = 150 + 40 * sinf(t * 0.2f + k * 1.7f), spin = (k % 2) ? -0.5f : 0.4f;
            for (int i = 0; i < 40; i++) {
              float u = i / 39.0f, th = u * 3.8f * 6.2832f;
              float r = R * powf(u, 0.82f) * (1 + 0.1f * sinf(th * 3 + t * 1.2f)), a = th + t * spin;
              int x = (int) (cx + r * cosf(a)), y = (int) (cy + r * sinf(a) * 0.85f);
              pts[k][i].x = x < 0 ? 0 : (x > 479 ? 479 : x); pts[k][i].y = y < 0 ? 0 : (y > 479 ? 479 : y);
            }
            lv_line_set_points(o[k], pts[k], 40);
            lv_obj_set_style_line_opa(o[k], (lv_opa_t) (70 + 60 * e), LV_PART_MAIN);
          }
  - interval: 15s                         # the screen dims when nothing has happened for two minutes
    then:
      - if:
          condition:
            lambda: |-
              auto st = id(player).state;       // the media player has no is_playing(): playing or announcing keeps the screen lit
              return millis() - id(last_activity) > 120000 && st != media_player::MEDIA_PLAYER_STATE_PLAYING
                     && st != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          then:
            - light.turn_on:
                id: backlight
                brightness: 8%

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 600ms

display:
  - platform: mipi_rgb
    id: lcd
    model: CUSTOM
    cs_pin:
      pca9554: expander
      number: 0
      id: lcd_spi_cs
    data_rate: 1MHz
    data_pins:
      blue: [40, 41, 42, 2, 1]
      green: [21, 8, 18, 45, 38, 39]
      red: [10, 11, 12, 13, 14]
    de_pin: GPIO17
    hsync_pin: GPIO46
    vsync_pin: GPIO3
    pclk_pin: GPIO9
    pclk_frequency: 16MHz
    pclk_inverted: false
    pixel_mode: 16bit
    dimensions:
      width: 480
      height: 480
    hsync_pulse_width: 10
    hsync_back_porch: 10
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    invert_colors: false
    init_sequence:
      - [0x11]
      - [0x29]

spi:
  - id: display_spi
    interface: software
    clk_pin:
      pca9554: expander
      number: 2
      id: lcd_spi_clk
    mosi_pin:
      pca9554: expander
      number: 1
      id: lcd_spi_mosi

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: lcd
    address: 0x14
    update_interval: 20ms
    on_touch:
      - lambda: 'id(last_activity) = millis();'
      - light.turn_on:
          id: backlight
          brightness: 70%
      - binary_sensor.template.publish:
          id: tapped
          state: true
    on_release:
      - binary_sensor.template.publish:
          id: tapped
          state: false

lvgl:
  displays:
    - lcd
  touchscreens:
    - touch
  buffer_size: 25%
