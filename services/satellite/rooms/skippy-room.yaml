                lv_obj_set_style_line_opa(ry[i], (lv_opa_t) (255 * fade * (bage > 150 ? 1 : 0)), LV_PART_MAIN);
              }
              bulb_was = true;
            } else if (bulb_was) {
              bulb_was = false;
              lv_obj_set_style_line_opa(id(bulb_out)->obj, 0, LV_PART_MAIN); lv_obj_set_style_line_opa(id(bulb_fill)->obj, 0, LV_PART_MAIN);
              lv_obj_t *ry[5] = {id(ray0)->obj, id(ray1)->obj, id(ray2)->obj, id(ray3)->obj, id(ray4)->obj};
              for (int i = 0; i < 5; i++) lv_obj_set_style_line_opa(ry[i], 0, LV_PART_MAIN);
            }
          }
          // ── ears: while he listens two big rounded ears grow out of the sides of the can, cocked at different angles, like he is being sarcastic ──
          { static float ear = 0; static lv_point_precise_t eo_[2][26], ef_[2][26];
            bool hearing = st == "listening" || st == "recording" || (st == "idle" && id(in_session) && !talk) || (st.empty() && id(in_session));
            ear += ((hearing ? 1.0f : 0.0f) - ear) * 0.3f;
            lv_obj_t *fo[4] = {id(ear_fl)->obj, id(ear_fr)->obj, id(ear_ol)->obj, id(ear_or)->obj};
            if (ear < 0.06f) { for (int k = 0; k < 4; k++) lv_obj_set_style_line_opa(fo[k], 0, LV_PART_MAIN); }
            else for (int sd = 0; sd < 2; sd++) {
              float s2 = sd ? 1.0f : -1.0f, a = (sd ? 0.95f : 0.45f) + 0.12f * sinf(ph * 2.3f + sd * 2.0f) + 0.2f * (st == "recording"), rot = s2 * a;
              float by = cy - 4, bx = cx + (pivotY - by) * lt + s2 * 104, ew = 21 * ear, eh = 44 * ear;
              float ux = sinf(rot), uy = -cosf(rot), rx = cosf(rot), ry = sinf(rot);          // up along the ear's long axis, and across it
              float c0x = bx + ux * eh * 0.7f, c0y = by + uy * eh * 0.7f;
              for (int i = 0; i < 26; i++) { float t = i * 6.2832f / 25; float lx = ew * cosf(t), lu = eh * sinf(t);
                eo_[sd][i].x = (int) (c0x + rx * lx + ux * lu); eo_[sd][i].y = (int) (c0y + ry * lx + uy * lu); }
              int nf = 0; bool lr = true;                                                       // the fill: rows across the ear, kept inside the outline
              for (float u = -(eh - 8); u <= eh - 8 && nf < 24; u += 7) {
                float half = (ew - 7) * sqrtf(fmaxf(1 - (u / (eh - 5)) * (u / (eh - 5)), 0.0f)); if (half < 1) half = 1;
                float l0 = lr ? -half : half, l1 = lr ? half : -half; lr = !lr;
                ef_[sd][nf].x = (int) (c0x + rx * l0 + ux * u); ef_[sd][nf++].y = (int) (c0y + ry * l0 + uy * u);
                ef_[sd][nf].x = (int) (c0x + rx * l1 + ux * u); ef_[sd][nf++].y = (int) (c0y + ry * l1 + uy * u);
              }
              put(fo[sd], ef_[sd], nf); put(fo[2 + sd], eo_[sd], 26);
              lv_obj_set_style_line_opa(fo[sd], 255, LV_PART_MAIN); lv_obj_set_style_line_opa(fo[2 + sd], 255, LV_PART_MAIN);
            }
          }
          { static uint32_t acc_us = 0, n_us = 0; acc_us += micros() - t_us0;                // how much of the tick is this code (the rest is drawing)
            if (++n_us == 60) { ESP_LOGI("face", "code %.1f ms per tick", acc_us / 60000.0f); acc_us = n_us = 0; } }
  - interval: 15s                         # the screen dims when nothing has happened for two minutes
    then:
      - if:
          condition:
            lambda: |-
              auto st = id(player).state;       // the media player has no is_playing(): playing or announcing keeps the screen lit
              return millis() - id(last_activity) > 120000 && st != media_player::MEDIA_PLAYER_STATE_PLAYING
                     && st != media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
          then:
            - light.turn_on:
                id: backlight
                brightness: 8%

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 600ms

display:
  - platform: mipi_rgb
    id: lcd
    model: CUSTOM
    cs_pin:
      pca9554: expander
      number: 0
      id: lcd_spi_cs
    data_rate: 1MHz
    data_pins:
      blue: [40, 41, 42, 2, 1]
      green: [21, 8, 18, 45, 38, 39]
      red: [10, 11, 12, 13, 14]
    de_pin: GPIO17
    hsync_pin: GPIO46
    vsync_pin: GPIO3
    pclk_pin: GPIO9
    pclk_frequency: 12MHz
    pclk_inverted: false
    pixel_mode: 16bit
    dimensions:
      width: 480
      height: 480
    hsync_pulse_width: 10
    hsync_back_porch: 10
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    invert_colors: false
    init_sequence:
      - [0x11]
      - [0x29]

spi:
  - id: display_spi
    interface: software
    clk_pin:
      pca9554: expander
      number: 2
      id: lcd_spi_clk
    mosi_pin:
      pca9554: expander
      number: 1
      id: lcd_spi_mosi

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: lcd
    address: 0x14
    update_interval: 20ms
    on_touch:
      - lambda: 'id(last_activity) = millis();'
      - light.turn_on:
          id: backlight
          brightness: 70%
      - binary_sensor.template.publish:
          id: tapped
          state: true
    on_release:
      - binary_sensor.template.publish:
          id: tapped
          state: false

