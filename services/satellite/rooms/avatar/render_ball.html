<!doctype html>
<!-- Renders Skippy's brushed-aluminium sphere with an engraved face, one frame per mouth shape (Rhubarb's A-H and X, plus a blink), for the room box.
     Served and captured by build_avatar.py ball; not part of the portal. The face is drawn on a canvas used as colour and as bump map, so the
     features are engraved into a metal ball that reflects a soft studio. -->
<meta charset="utf-8">
<title>Skippy ball</title>
<style>html,body{margin:0;background:#303}canvas{display:block}</style>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const P = new URLSearchParams(location.search);
const W = +P.get("w") || 320, H = +P.get("h") || 320, SS = 2;
const CAN = P.get("shape") === "can";                              // an upright beer can instead of the ball
const ONLY = P.get("only");                                     // a single shape letter, to look at one
const SHAPES = ["X", "A", "B", "C", "D", "E", "F", "G", "H", "Z"];   // Z: eyes closed, mouth at rest

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
renderer.setPixelRatio(1); renderer.setSize(W * SS, H * SS, false); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.append(renderer.domElement);
const small = document.createElement("canvas"); small.width = W; small.height = H;
const sctx = small.getContext("2d"); sctx.imageSmoothingQuality = "high";

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-2, 2.5, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0xb05cff, 2.2); rim.position.set(3, 0.5, -2); scene.add(rim);     // purple Skippy's glow on the edge
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 50);
if (CAN) { camera.position.set(0, 0.45, 3.35); camera.lookAt(0, 0.02, 0); } else { camera.position.set(0, 0.04, 4.35); camera.lookAt(0, 0, 0); }

const CW = 2048, CH = 1024, K = CW / 360;                        // pixels per degree, both ways (equirectangular)
const colour = document.createElement("canvas"), bump = document.createElement("canvas");
colour.width = bump.width = CW; colour.height = bump.height = CH;
const cx = colour.getContext("2d"), bx = bump.getContext("2d");
const colourTex = new THREE.CanvasTexture(colour), bumpTex = new THREE.CanvasTexture(bump);
colourTex.colorSpace = THREE.SRGBColorSpace; colourTex.anisotropy = 8; bumpTex.anisotropy = 8;
const canGeo = () => {
  const R = 0.5, Hh = 0.7, pts = [[0.001, -Hh], [R * 0.8, -Hh], [R * 0.9, -Hh + 0.025], [R * 0.97, -Hh + 0.07], [R, -Hh + 0.13], [R, Hh - 0.15], [R * 0.97, Hh - 0.085],
    [R * 0.9, Hh - 0.035], [R * 0.82, Hh - 0.008], [R * 0.8, Hh], [R * 0.72, Hh - 0.025], [0.001, Hh - 0.025]].map(([x, y]) => new THREE.Vector2(x, y));
  return new THREE.LatheGeometry(pts, 96);
};
const ball = new THREE.Mesh(CAN ? canGeo() : new THREE.SphereGeometry(1, 128, 96),
  new THREE.MeshStandardMaterial({ color: 0xffffff, map: colourTex, bumpMap: bumpTex, bumpScale: CAN ? 1.2 : 6, metalness: 1, roughness: CAN ? 0.34 : 0.3 }));
scene.add(ball);

const FX = 0.25 * CW, FY = 0.5 * CH;                            // the face looks at the camera (u = .25 is +z on a three.js sphere)
const deg = d => d * K;
function ellipse(c, x, y, w, h, fill) { c.fillStyle = fill; c.beginPath(); c.ellipse(FX + deg(x), FY + deg(y), deg(w) / 2, deg(h) / 2, 0, 0, 7); c.fill(); }
function band(c, x, y, w, h, r, fill) {
  c.fillStyle = fill; c.beginPath(); c.roundRect(FX + deg(x - w / 2), FY + deg(y - h / 2), deg(w), deg(h), deg(r)); c.fill();
}
function face(shape) {
  cx.fillStyle = "#cfd3da"; cx.fillRect(0, 0, CW, CH);            // the metal's own colour, a touch of blue
  bx.fillStyle = "#808080"; bx.fillRect(0, 0, CW, CH);
  const blink = shape === "Z", m = blink ? "X" : shape;
  if (P.get("blank") === "1") {
    if (CAN) for (let i = 0; i < 2600; i++) {                      // brushed: fine rings round the can, in the colour and in the bump
      const y = Math.random() * CH, a = 0.015 + Math.random() * 0.035, g = Math.random() < 0.5 ? "255,255,255" : "40,44,52";
      cx.fillStyle = `rgba(${g},${a})`; cx.fillRect(0, y, CW, 1 + Math.random());
      bx.fillStyle = `rgba(${g},${a * 1.5})`; bx.fillRect(0, y, CW, 1);
    }
    colourTex.needsUpdate = true; bumpTex.needsUpdate = true; return;
  }       // the bare ball: the box draws the face live
  // brows: two slanting cuts, a little sarcastic
  for (const s of [-1, 1]) {
    for (const [c, col] of [[cx, "#22252b"], [bx, "#202020"]]) {
      c.save(); c.translate(FX + deg(s * 15), FY + deg(-20)); c.rotate(s * -0.22); c.fillStyle = col;
      c.beginPath(); c.roundRect(-deg(7), -deg(0.9), deg(14), deg(1.8), deg(0.9)); c.fill(); c.restore();
    }
    // eyes: an engraved socket, a dark glass in it with one bright catch-light
    const eh = blink ? 1.6 : 11;
    for (const [c, col] of [[cx, "#1b1d22"], [bx, "#101010"]]) ellipse(c, s * 15, -9, 10, eh, col);
    if (!blink) { ellipse(cx, s * 15 + 1.2, -12, 3, 3.4, "#e9edf5"); ellipse(bx, s * 15 + 1.2, -12, 3, 3.4, "#b0b0b0"); }
  }
  // the mouth, centred below the eyes; interior dark, teeth light, tongue pink
  const y = 14, dark = "#16171b", deep = "#050505", teeth = "#eceef2", tongue = "#c25b73";
  const cut = (w, h, r) => { band(cx, 0, y, w, h, r, dark); band(bx, 0, y, w, h, r, deep); };
  if (m === "X") { band(cx, 0, y, 22, 1.4, 0.7, "#22252b"); band(bx, 0, y, 22, 1.4, 0.7, "#181818"); }
  else if (m === "A") { band(cx, 0, y, 24, 2.2, 1.1, "#22252b"); band(bx, 0, y, 24, 2.2, 1.1, "#101010"); }
  else if (m === "B") { cut(26, 4.4, 2); band(cx, 0, y - 1.2, 22, 1.6, 0.6, teeth); }
  else if (m === "C") { cut(26, 9, 4.5); band(cx, 0, y - 3.2, 22, 1.6, 0.6, teeth); }
  else if (m === "D") { cut(28, 15, 7); band(cx, 0, y - 5.6, 24, 1.8, 0.7, teeth); ellipse(cx, 0, y + 4, 14, 5, tongue); }
  else if (m === "E") { ellipse(cx, 0, y, 16, 12, dark); ellipse(bx, 0, y, 16, 12, deep); }
  else if (m === "F") { ellipse(cx, 0, y, 10, 8, dark); ellipse(bx, 0, y, 10, 8, deep); }
  else if (m === "G") { cut(26, 5.6, 2.4); band(cx, 0, y - 1.5, 22, 2, 0.7, teeth); band(cx, 0, y + 1.9, 18, 1.4, 0.7, "#9aa0ab"); }
  else if (m === "H") { cut(22, 8, 4); band(cx, 0, y - 2.6, 18, 1.4, 0.6, teeth); ellipse(cx, 0, y + 1.8, 11, 3.6, tongue); }
  const soft = document.createElement("canvas"); soft.width = CW; soft.height = CH;     // engraved edges are not razor-sharp
  const sc = soft.getContext("2d"); sc.filter = "blur(3px)"; sc.drawImage(bump, 0, 0); bx.clearRect(0, 0, CW, CH); bx.drawImage(soft, 0, 0);
  colourTex.needsUpdate = true; bumpTex.needsUpdate = true;
}

const out = [];
for (let i = 0; i < SHAPES.length; i++) {
  if (ONLY && SHAPES[i] !== ONLY) continue;
  face(SHAPES[i]);
  renderer.render(scene, camera);
  sctx.clearRect(0, 0, W, H); sctx.drawImage(renderer.domElement, 0, 0, W, H);
  await fetch(`/frame/ball/${i}`, { method: "POST", body: small.toDataURL("image/png") });
  out.push(SHAPES[i]);
}
await fetch("/done", { method: "POST", body: JSON.stringify(out) });
document.title = "done " + out.join("");
</script>
