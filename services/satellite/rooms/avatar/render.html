<!doctype html>
<!-- Renders the chat's 3D Skippy (portal/static/skippy/skippy.glb, the motion of portal/static/skippy-3d.js) to the room box's animation frames.
     Served and captured by build_avatar.py; not part of the portal. Each loop's sine speeds are rounded to whole cycles, so it loops seamlessly. -->
<meta charset="utf-8">
<title>Skippy frames</title>
<style>html,body{margin:0;background:#303}canvas{display:block}</style>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const P = new URLSearchParams(location.search);
const W = +P.get("w") || 180, H = +P.get("h") || 220;
const LOOPS = JSON.parse(P.get("loops") || '[{"name":"idle","seconds":5.333,"frames":32,"level":0,"tilt":0}]');

const SS = 2;                                                   // drawn at twice the size, then shrunk: smooth edges and fine ink lines
const canvas = document.createElement("canvas"); document.body.append(canvas);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
renderer.setPixelRatio(1); renderer.setSize(W * SS, H * SS, false); renderer.setClearColor(0x000000, 0);
const small = document.createElement("canvas"); small.width = W; small.height = H;
const sctx = small.getContext("2d"); sctx.imageSmoothingQuality = "high";
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x202038, 0.9));          // less fill than the chat's: the features cast shadows
const sun = new THREE.DirectionalLight(0xffffff, 3.2); sun.position.set(-2.2, 2.2, 2.4); scene.add(sun);
const rim = new THREE.DirectionalLight(0xa66cff, 1.4); rim.position.set(2, 1, -2); scene.add(rim);

const gltf = await new GLTFLoader().loadAsync("/portal/static/skippy/skippy.glb");
const skippy = new THREE.Group(); skippy.add(gltf.scene); scene.add(skippy);
const part = {};
gltf.scene.traverse(o => { if (o.isMesh) part[o.name.replace(/\.\d+$/, "")] = o; });
gltf.scene.traverse(o => {                                      // the head's face colours are its second colour set (the first is all white)
  const g = o.isMesh && o.geometry;
  if (g && g.getAttribute("color_1")) { g.setAttribute("color", g.getAttribute("color_1")); o.material.vertexColors = true; o.material.needsUpdate = true; }
});
function pivot(mesh, where) {                                   // as skippy-3d.js: each moving part turns about its joint
  const box = new THREE.Box3().setFromObject(mesh), c = box.getCenter(new THREE.Vector3());
  const p = new THREE.Group(); p.position.set(c.x, where === "base" ? box.min.y : c.y, c.z);
  mesh.parent.add(p); p.attach(mesh); return p;
}
const head = part.head && pivot(part.head, "base"), hat = part.hat && pivot(part.hat, "base");
if (head && hat) head.attach(hat);
const pointer = part.hand_r && pivot(part.hand_r, "centre"), rest = part.hand_l && pivot(part.hand_l, "centre");
const HEADMODE = P.get("head") === "1";                         // the head and hat alone, still; the box animates it and draws the mouth itself
let mouth = null;
if (HEADMODE) {
  gltf.scene.traverse(o => { if (o.isMesh && o !== part.head && o !== part.hat) o.visible = false; });
  const g = part.head.geometry, col = g.getAttribute("color"), pos = g.getAttribute("position");
  const isRed = i => col.getX(i) > 0.25 && col.getX(i) > 1.6 * col.getY(i) && col.getX(i) > 1.6 * col.getZ(i);
  let skin = [0, 0, 0, 0];
  for (let i = 0; i < col.count; i++) if (!isRed(i) && col.getX(i) > 0.55 && col.getY(i) > 0.55) { skin[0] += col.getX(i); skin[1] += col.getY(i); skin[2] += col.getZ(i); skin[3]++; }
  const mv = []; for (let i = 0; i < col.count; i++) if (isRed(i)) mv.push(i);
  const flat = (at) => { const o = new Float32Array(at.count * 3); for (let i = 0; i < at.count; i++) { o[i * 3] = at.getX(i); o[i * 3 + 1] = at.getY(i); o[i * 3 + 2] = at.getZ(i); } return o; };
  const nrm = g.getAttribute("normal"), nrm0 = flat(nrm), pos0 = flat(pos), col0 = col.array.slice(), sk = skin.map(v => v / skin[3]);
  const mean = new THREE.Vector3(), all = new THREE.Vector3();
  for (const i of mv) mean.add(new THREE.Vector3(pos0[i * 3], pos0[i * 3 + 1], pos0[i * 3 + 2]));
  for (let i = 0; i < pos.count; i++) all.add(new THREE.Vector3(pos0[i * 3], pos0[i * 3 + 1], pos0[i * 3 + 2]));
  const dir = mean.divideScalar(mv.length).sub(all.divideScalar(pos.count)).normalize();
  let rim = -1e9; for (const i of mv) rim = Math.max(rim, pos0[i * 3] * dir.x + pos0[i * 3 + 1] * dir.y + pos0[i * 3 + 2] * dir.z);
  // open: 1 = as modelled, 0 = the cavity pushed out to the lip plane and painted skin (the box draws the closed line over it)
  const setOpen = open => {
    for (const i of mv) {
      const d = pos0[i * 3] * dir.x + pos0[i * 3 + 1] * dir.y + pos0[i * 3 + 2] * dir.z, k = (rim - d) * (1 - open);
      pos.setXYZ(i, pos0[i * 3] + dir.x * k, pos0[i * 3 + 1] + dir.y * k, pos0[i * 3 + 2] + dir.z * k);
      nrm.setXYZ(i, nrm0[i * 3] + (dir.x - nrm0[i * 3]) * (1 - open), nrm0[i * 3 + 1] + (dir.y - nrm0[i * 3 + 1]) * (1 - open), nrm0[i * 3 + 2] + (dir.z - nrm0[i * 3 + 2]) * (1 - open));
      for (let c = 0; c < 3; c++) col.array[i * col.itemSize + c] = sk[c] + (col0[i * col.itemSize + c] - sk[c]) * open;
    }
    pos.needsUpdate = true; col.needsUpdate = true; nrm.needsUpdate = true;
  };
  console.log("mouth vertices", mv.length, "dir", dir.toArray());
  mouth = { idx: mv, pos, setOpen };
}
const box = new THREE.Box3().setFromObject(HEADMODE ? head : gltf.scene), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 1000);
const fit = Math.max(size.y * 1.12, size.x / camera.aspect) * 0.62 / (+P.get('zoom') || 1) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));   // a little room for the float
const LOOK = P.has("look") ? +P.get("look") : 0.14;                         // the camera a little below his middle, looking up: his eyes show under the brim
camera.position.set(mid.x, mid.y - size.y * LOOK, mid.z + fit); camera.lookAt(mid.x, mid.y + size.y * 0.04, mid.z); camera.updateProjectionMatrix();
const base = { head: head && head.rotation.clone(), hat: hat && hat.rotation.clone(), y: skippy.position.y };

// The ink: edges where the surface turns sharply (normals) or one part sits in front of another (depth), drawn dark over the colour.
const rtColour = new THREE.WebGLRenderTarget(W * SS, H * SS, { samples: 4 });
const rtNormal = new THREE.WebGLRenderTarget(W * SS, H * SS, { depthTexture: new THREE.DepthTexture(W * SS, H * SS) });
const normalMat = new THREE.MeshNormalMaterial();
const ink = new THREE.ShaderMaterial({
  uniforms: { col: { value: rtColour.texture }, nrm: { value: rtNormal.texture }, dep: { value: rtNormal.depthTexture },
              px: { value: new THREE.Vector2(1 / (W * SS), 1 / (H * SS)) }, near: { value: camera.near }, far: { value: camera.far } },
  vertexShader: "varying vec2 v; void main(){ v = uv; gl_Position = vec4(position.xy, 0., 1.); }",
  fragmentShader: `
    uniform sampler2D col, nrm, dep; uniform vec2 px; uniform float near, far; varying vec2 v;
    float lin(vec2 p){ float z = texture2D(dep, p).x * 2. - 1.; return 2. * near * far / (far + near - z * (far - near)); }
    void main(){
      vec3 n = texture2D(nrm, v).xyz; float d = lin(v), e = 0.;
      vec2 o[4]; o[0] = vec2(px.x, 0.); o[1] = vec2(-px.x, 0.); o[2] = vec2(0., px.y); o[3] = vec2(0., -px.y);
      for (int i = 0; i < 4; i++) {
        e = max(e, smoothstep(0.25, 0.6, distance(n, texture2D(nrm, v + o[i] * 1.5).xyz)));
        e = max(e, smoothstep(0.012, 0.03, abs(lin(v + o[i] * 1.5) - d) / d));
      }
      vec4 c = texture2D(col, v);
      gl_FragColor = vec4(c.rgb * (1. - 0.85 * e), max(c.a, 0.85 * e));
    }`,
});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ink), post = new THREE.Scene(), flat = new THREE.Camera(); post.add(quad);
function draw() {
  renderer.setRenderTarget(rtColour); renderer.render(scene, camera);
  scene.overrideMaterial = normalMat; renderer.setRenderTarget(rtNormal); renderer.render(scene, camera); scene.overrideMaterial = null;
  renderer.setRenderTarget(null); renderer.render(post, flat);
  sctx.clearRect(0, 0, W, H); sctx.drawImage(canvas, 0, 0, W, H);
}

function pose(t, T, level, tilt) {
  const w = (f) => { const n = Math.round(f * T / (2 * Math.PI)); return n * 2 * Math.PI / T; };   // whole cycles per loop
  const s = (f, ph = 0) => Math.sin(w(f) * t + ph);
  const chatter = s(13) * 0.5 + s(7.3, 1) * 0.5;
  skippy.position.y = base.y + s(1.6) * 0.9 + level * Math.abs(s(6.5)) * 0.9;
  skippy.rotation.y = s(0.55) * 0.22 + level * s(2.1) * 0.12;
  if (head) {
    head.rotation.x = base.head.x + s(1.1) * 0.04 + level * (0.10 + chatter * 0.10);
    head.rotation.z = base.head.z + s(0.8) * 0.05 + tilt * 0.22;
    head.scale.y = 1 + level * 0.035 * (chatter * 0.5 + 0.5);
  }
  if (hat) {
    hat.rotation.x = base.hat.x + s(1.1, -0.5) * 0.05 + level * s(9) * 0.06;
    hat.rotation.z = base.hat.z + s(0.8, -0.6) * 0.04 - tilt * 0.05;
  }
  if (pointer) pointer.rotation.z = s(2.4) * 0.05 + level * s(5.2) * 0.1;
  if (rest) rest.rotation.z = s(1.3, 2) * 0.04;
}

const out = [];
if (HEADMODE) {                                                 // one still frame, and where the painted mouth was, in its pixels
  head.updateMatrixWorld(true); camera.updateMatrixWorld(true);
  const pts = []; const v = new THREE.Vector3();
  for (const i of mouth.idx) { v.fromBufferAttribute(mouth.pos, i).applyMatrix4(part.head.matrixWorld).project(camera); pts.push([(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]); }
  const ys = pts.map(p => p[1]), ylo = Math.min(...ys), yhi = Math.max(...ys);
  const low = pts.filter(p => p[1] > ylo + 0.35 * (yhi - ylo));          // the eye slits are red too: the mouth is the lower part
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of low) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  for (let i = 0; i < 1; i++) { mouth.setOpen(0); draw(); await fetch(`/frame/head/${i}`, { method: "POST", body: small.toDataURL("image/png") }); }
  await fetch("/meta", { method: "POST", body: JSON.stringify({ cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0, n: mouth.idx.length }) });
  await fetch("/done", { method: "POST", body: "[]" });
  document.title = "done head " + JSON.stringify([x0, y0, x1, y1]);
  throw new Error("done");
}
for (const L of LOOPS) {
  for (let i = 0; i < L.frames; i++) {
    pose(i * L.seconds / L.frames, L.seconds, L.level, L.tilt);
    draw();
    const png = small.toDataURL("image/png");
    await fetch(`/frame/${L.name}/${i}`, { method: "POST", body: png });
    out.push(`${L.name}/${i}`);
  }
}
await fetch("/done", { method: "POST", body: JSON.stringify(out) });
document.title = "done " + out.length;
</script>
