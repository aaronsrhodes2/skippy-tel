## Skippy's wake word, for openWakeWord's train.py (paths are inside the container: /work is state/wakeword on skippy-pc). See README.md.
model_name: "skippy"

# What wakes him. One binary model fires on either.
target_phrase:
  - "skippy"
  - "hey skippy"

# What must NOT wake him, on top of the near-misses train.py makes from the phonemes. "Skipper" is first: it is one of the Captain's own
# names (what Skippy calls HIM), so hearing it must never wake the house.
custom_negative_phrases:
  - "skipper"
  - "hey skipper"
  - "skip it"
  - "skip"
  - "skipping"
  - "slippy"
  - "zippy"
  - "kippy"
  - "chippy"
  - "sippy cup"
  - "hippie"
  - "happy"
  - "skype"
  - "computer"

n_samples: 50000
n_samples_val: 5000
tts_batch_size: 50
augmentation_batch_size: 16
augmentation_rounds: 1
piper_sample_generator_path: "/opt/piper-sample-generator"
output_dir: "/work/train"

rir_paths:
  - "/work/data/mit_rirs"
background_paths:
  - "/work/data/audioset_16k"
  - "/work/data/fma"
background_paths_duplication_rate:
  - 1
  - 1

false_positive_validation_data_path: "/work/data/validation_set_features.npy"
feature_data_files:
  "ACAV100M_sample": "/work/data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"
batch_n_per_class:
  "ACAV100M_sample": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32
steps: 50000
max_negative_weight: 1500
# A house that hears all day: fewer than one false wake every ten hours is the target (the default is ~0.2 an hour)
target_false_positives_per_hour: 0.1
