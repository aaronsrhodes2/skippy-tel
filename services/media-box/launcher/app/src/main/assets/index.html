<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skippy</title>
<style>
  /* The bedroom TV's home screen, in the portal's bridge look: black (the Captain's colour doctrine: black is empty), cut corners, lamps that breathe,
     glyphs instead of words, and the focused control lit. No gradients, no fills behind text: tiles are outlines on black. */
  :root { --g:#00FF88; --w:#FFFFFF; --a:#FFAA00; --c:#00CCFF; --v:#818CF8; --r:#FF4444; --dg:#003322; --dgh:#006644; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; color: var(--w); overflow: hidden;
               font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { padding: 4.5vh 5vw; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; height: 12vh; }
  .mark { display: flex; align-items: center; gap: 1.6vw; }
  .mark .name { font-size: 5.4vh; letter-spacing: .5vw; font-weight: 700; color: var(--g); }
  .mark .name i { color: var(--w); font-style: normal; font-weight: 300; }
  .clock { text-align: right; }
  .clock .t { font-size: 6vh; font-weight: 300; color: var(--a); letter-spacing: .15vw; }
  .clock .d { font-size: 2.2vh; color: var(--dgh); letter-spacing: .3vw; text-transform: uppercase; }

  .lamps { display: flex; gap: 2.2vw; margin-top: 1.5vh; height: 4vh; align-items: center; }
  .lamp { display: flex; align-items: center; gap: .7vw; font-size: 1.9vh; letter-spacing: .25vw; color: var(--dgh); text-transform: uppercase; }
  .lamp b { width: 1.5vh; height: 1.5vh; background: var(--dg); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .lamp.up b { background: var(--c); animation: breathe 3s ease-in-out infinite; }
  .lamp.up { color: var(--c); }
  .lamp.down b { background: var(--r); }
  .lamp.down { color: var(--r); }
  @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4vh; }
  .row { display: flex; gap: 2.4vw; }
  .tile { --k: var(--g); position: relative; flex: 1; height: 31vh; background: var(--k); border: 0; outline: 0; color: var(--k);
          clip-path: polygon(0 0, calc(100% - 3.2vh) 0, 100% 3.2vh, 100% 100%, 3.2vh 100%, 0 calc(100% - 3.2vh)); cursor: pointer; opacity: .55; transition: opacity .12s, transform .12s; }
  .tile::before { content: ""; position: absolute; inset: .45vh; background: #000;
          clip-path: polygon(0 0, calc(100% - 3.0vh) 0, 100% 3.0vh, 100% 100%, 3.0vh 100%, 0 calc(100% - 3.0vh)); }
  .tile > span { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh; height: 100%; }
  .tile svg { width: 11vh; height: 11vh; fill: none; stroke: var(--k); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .tile .lbl { font-size: 2.6vh; letter-spacing: .5vw; font-weight: 600; color: var(--w); text-transform: uppercase; }
  .tile:focus, .tile.on { opacity: 1; transform: scale(1.045); z-index: 3; }
  .tile:focus::before, .tile.on::before { background: #02130c; }
  .tile.big { flex: 1; height: 46vh; }
  .row.small { justify-content: center; }
  .row.small .tile { flex: 0 0 18vw; height: 12vh; }
  .row.small .tile svg { width: 5vh; height: 5vh; }
  .row.small .tile > span { flex-direction: row; gap: 1.6vw; }
  .row.small .tile .lbl { font-size: 1.9vh; }
  .tile.g { --k: var(--g); } .tile.a { --k: var(--a); } .tile.r { --k: var(--r); } .tile.c { --k: var(--c); } .tile.v { --k: var(--v); } .tile.d { --k: var(--dgh); }
  .tile.big svg { width: 20vh; height: 20vh; }
  .tile.big .lbl { font-size: 4.4vh; }

  footer { height: 5vh; display: flex; justify-content: space-between; align-items: center; font-size: 1.9vh; letter-spacing: .3vw; color: var(--dgh); text-transform: uppercase; }
  footer kbd { color: var(--g); font-family: inherit; }

  #cover { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; z-index: 9; }
  #cover.on { display: flex; }
  #cover .big { font-size: 9vh; color: var(--g); font-weight: 700; letter-spacing: 1vw; }
  #cover .sub { font-size: 2.6vh; color: var(--dgh); letter-spacing: .4vw; text-transform: uppercase; }
  #cover .n { font-size: 16vh; font-weight: 200; color: var(--a); }

  #apps { position: fixed; inset: 0; background: #000; display: none; padding: 5vh 5vw; z-index: 8; flex-direction: column; gap: 3vh; }
  #apps.on { display: flex; }
  #apps h1 { font-size: 3vh; letter-spacing: .6vw; color: var(--v); font-weight: 600; text-transform: uppercase; }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.6vh 1.6vw; align-content: start; overflow: hidden; }
  #grid button { --k: var(--v); height: 11vh; background: #000; border: .35vh solid var(--dg); color: var(--w); font-size: 2.3vh; letter-spacing: .15vw; outline: 0;
          clip-path: polygon(0 0, calc(100% - 2vh) 0, 100% 2vh, 100% 100%, 2vh 100%, 0 calc(100% - 2vh)); }
  #grid button:focus { border-color: var(--v); color: var(--v); }
</style>
</head>
<body>
<header>
  <div class="mark">
    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#00FF88" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8h28v6l4 4v32l-4 4v6H18v-6l-4-4V18l4-4z"/><path d="M22 28h20M22 36h20"/><circle cx="32" cy="46" r="3"/>
    </svg>
    <div>
      <div class="name">SKIPPY<i>&nbsp;THE MAGNIFICENT</i></div>
      <div class="lamps" id="lamps"></div>
    </div>
  </div>
  <div class="clock"><div class="t" id="t">--:--</div><div class="d" id="d"></div></div>
</header>

<main>
  <div class="row" id="r1">
    <button class="tile big g" data-do="steam"><span>
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26"/><circle cx="40" cy="26" r="7"/><circle cx="22" cy="40" r="5"/><path d="M26 36l9-7"/></svg>
      <div class="lbl">Steam</div></span></button>
    <button class="tile big a" data-pkg="com.plexapp.android"><span>
      <svg viewBox="0 0 64 64"><path d="M20 10h14l14 22-14 22H20l14-22z"/></svg><div class="lbl">Plex</div></span></button>
  </div>
  <div class="row small" id="r2">
    <button class="tile v" data-do="apps"><span>
      <svg viewBox="0 0 64 64"><rect x="10" y="10" width="16" height="16"/><rect x="38" y="10" width="16" height="16"/><rect x="10" y="38" width="16" height="16"/><rect x="38" y="38" width="16" height="16"/></svg><div class="lbl">All apps</div></span></button>
    <button class="tile d" data-do="settings"><span>
      <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="10"/><path d="M32 6v10M32 48v10M6 32h10M48 32h10M14 14l7 7M43 43l7 7M50 14l-7 7M21 43l-7 7"/></svg><div class="lbl">Settings</div></span></button>
  </div>
</main>

<footer><div><kbd>A</kbd> open &nbsp; <kbd>HOME</kbd> back here</div><div id="hint"></div></footer>

<div id="cover"><div class="big">STEAM</div><div class="n" id="cn">8</div><div class="sub">starting big picture &nbsp;·&nbsp; any key stops it</div></div>
<div id="apps"><h1>All apps</h1><div id="grid"></div></div>

<script>
(function () {
  var S = window.Skippy || { cold: function(){return false;}, launch: function(){}, steam: function(){}, settings: function(){}, apps: function(){return "[]";}, probe: function(){} };
  var $ = function (id) { return document.getElementById(id); };

  // clock
  function tick() {
    var n = new Date(), p = function (x) { return (x < 10 ? "0" : "") + x; };
    $("t").textContent = p(n.getHours()) + ":" + p(n.getMinutes());
    $("d").textContent = n.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }
  tick(); setInterval(tick, 10000);

  // status lamps: the house services this box talks to
  var LAMPS = [["pc", "skippy-pc", "192.168.0.164", 47989], ["plex", "plex", "192.168.0.164", 32400], ["core", "core", "skippy-core", 22]];
  var lampEl = {};
  LAMPS.forEach(function (l) {
    var e = document.createElement("div"); e.className = "lamp"; e.innerHTML = "<b></b>" + l[1]; $("lamps").appendChild(e); lampEl[l[0]] = e;
  });
  window.lamp = function (id, up) { lampEl[id].className = "lamp " + (up ? "up" : "down"); };
  function probe() { LAMPS.forEach(function (l) { S.probe(l[0], l[2] === "skippy-core" ? "192.168.0.186" : l[2], l[3]); }); }
  probe(); setInterval(probe, 20000);

  // tiles
  var rows = [Array.prototype.slice.call($("r1").children), Array.prototype.slice.call($("r2").children)];
  var cur = [0, 0], open = false;
  function focus(r, c) { cur = [r, Math.max(0, Math.min(rows[r].length - 1, c))]; rows[cur[0]][cur[1]].focus(); }
  function act(el) {
    var d = el.getAttribute("data-do"), p = el.getAttribute("data-pkg");
    if (d === "steam") S.steam(); else if (d === "settings") S.settings(); else if (d === "apps") showApps(); else if (p) S.launch(p);
  }
  rows.forEach(function (row, r) { row.forEach(function (el, c) { el.addEventListener("click", function () { act(el); }); el.addEventListener("focus", function () { cur = [r, c]; }); }); });

  // all apps
  function showApps() {
    var list = []; try { list = JSON.parse(S.apps()); } catch (e) {}
    var g = $("grid"); g.innerHTML = "";
    list.forEach(function (a) { var b = document.createElement("button"); b.textContent = a.l; b.onclick = function () { S.launch(a.p); }; g.appendChild(b); });
    $("apps").className = "on"; open = true;
    if (g.firstChild) g.firstChild.focus();
  }
  function hideApps() { $("apps").className = ""; open = false; focus(cur[0], cur[1]); }

  // boot: Steam by itself, once, unless a key is pressed
  var timer = null;
  function stopAuto() { if (timer) { clearInterval(timer); timer = null; $("cover").className = ""; focus(0, 0); } }
  window.home = function () { stopAuto(); if (open) hideApps(); focus(0, 0); };
  if (S.cold() && localStorage.getItem("autoSteam") !== "off") {
    var left = 8; $("cover").className = "on"; $("cn").textContent = left;
    timer = setInterval(function () {
      left--; $("cn").textContent = left;
      if (left <= 0) { clearInterval(timer); timer = null; $("cover").className = ""; S.steam(); focus(0, 0); }
    }, 1000);
  } else { focus(0, 0); }

  document.addEventListener("keydown", function (e) {
    if (timer) { stopAuto(); e.preventDefault(); return; }
    var k = e.key;
    if (open) {
      if (k === "Escape" || k === "Backspace" || k === "GoBack") { hideApps(); e.preventDefault(); return; }
      var gs = Array.prototype.slice.call($("grid").children), i = gs.indexOf(document.activeElement), cols = 5, n = i;
      if (k === "ArrowRight") n = i + 1; else if (k === "ArrowLeft") n = i - 1; else if (k === "ArrowDown") n = i + cols; else if (k === "ArrowUp") n = i - cols; else return;
      if (n >= 0 && n < gs.length) gs[n].focus();
      e.preventDefault(); return;
    }
    if (k === "ArrowRight") focus(cur[0], cur[1] + 1);
    else if (k === "ArrowLeft") focus(cur[0], cur[1] - 1);
    else if (k === "ArrowDown") focus(Math.min(1, cur[0] + 1), cur[1]);
    else if (k === "ArrowUp") focus(Math.max(0, cur[0] - 1), cur[1]);
    else return;
    e.preventDefault();
  });
})();
</script>
</body>
</html>
