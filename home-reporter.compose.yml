# The home reporter: pushes skippy-pc status + Bilby's music state to the
# cloud portal (outbound only). Kept in its own file so it can be started
# on its own:
#   docker compose -f home-reporter.compose.yml up -d --build
# SKIPPY_HOME_TOKEN comes from .env (press "Pair home" on the portal dashboard).
name: skippy-home-reporter
services:
  home-reporter:
    build: ./services/home-reporter
    container_name: skippytel-home-reporter
    restart: unless-stopped
    environment:
      SKIPPY_HOME_TOKEN: ${SKIPPY_HOME_TOKEN:-}
      BILBY_MAC_URL: ${BILBY_MAC_URL:-http://skippy-mac:7334}
      SKIPPY_API: http://host.docker.internal:3003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
