{# Skippy, the 2D animated face, drawn on a canvas in the browser.
   No backend service needed — state machine, blink, mouth, ring light
   all rendered client-side via skippy-face.js.
   Driven by skippy-speaking / skippy-thinking CustomEvents. #}
<div class="skippy3d" id="skippy3d">
  <canvas class="s3-face-canvas" width="160" height="160"></canvas>
  <button type="button" class="s3-x" aria-label="Hide Skippy" title="Hide Skippy">&times;</button>
  <button type="button" class="s3-face" aria-label="Show Skippy" title="Show Skippy"><img src="{{ url_for('static', filename='skippy/skippy-head.png') }}" alt="" width="256" height="256"></button>
</div>
<script type="module">
  import { Face } from "{{ url_for('static', filename='skippy-face.js') }}";
  window._skippyFace = new Face(document.getElementById("skippy3d").querySelector(".s3-face-canvas"));
  (function loop() {
    if (window._skippyFace) window._skippyFace.draw();
    requestAnimationFrame(loop);
  })();
</script>
<script src="{{ url_for('static', filename='skippy-3d.js') }}"></script>
