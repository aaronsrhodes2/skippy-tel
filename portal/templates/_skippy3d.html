{# Skippy in the corner of the chat: the pods' own animated face (static/skippy-face.js, a port of the hub's face_render.py), driven by
   static/skippy-3d.js. The still picture shows until the can's images have loaded, and stays if they fail or motion is reduced. #}
<div class="skippy3d" id="skippy3d" data-frames="{{ url_for('static', filename='skippy/face/') }}">
  <div class="s3-stage">
    <img class="s3-still" src="{{ url_for('static', filename='skippy/skippy-full.png') }}" alt="Skippy the Magnificent" width="540" height="660" decoding="async">
    <canvas class="s3-canvas" width="480" height="480" aria-hidden="true"></canvas>
  </div>
  <button type="button" class="s3-x" aria-label="Hide Skippy" title="Hide Skippy" data-tel="skippy3d:hide-skippy">&times;</button>
  <button type="button" class="s3-face" aria-label="Show Skippy" title="Show Skippy" data-tel="skippy3d:show-skippy"><img src="{{ url_for('static', filename='skippy/skippy-head.png') }}" alt="" width="256" height="256"></button>
</div>
<script src="{{ url_for('static', filename='skippy-face.js') }}"></script>
<script src="{{ url_for('static', filename='skippy-3d.js') }}"></script>
