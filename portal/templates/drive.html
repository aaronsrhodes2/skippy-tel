{% extends "base.html" %}
{% block title %}Drive — Maker Portal{% endblock %}
{% block app %}drive{% endblock %}
{% block ui %}bridge{% endblock %}
{% block glyph %}wheel{% endblock %}
{% block head %}
<style>
  /* Drive (drive.py): six big keys, one screen, for the Tesla's browser. 3 x 2 on the car's wide screen, 2 x 3 upright.
     Skippy's key IS his face (the pods' own, static/skippy-face.js); the last key is the house's lamps. */
  #drive { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #drive .deck { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-aspect-ratio: 1/1) { #drive .deck { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); } }
  #drive .unit .g { width: 42%; max-width: 132px; stroke-width: 1.1; }
  #drive .unit .g.sub { position: absolute; right: 14%; bottom: 22%; width: 22%; max-width: 46px; aspect-ratio: 1; z-index: 1; opacity: .9; }
  #drive .unit .name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #drive .unit[data-on="1"] { filter: drop-shadow(0 0 9px color-mix(in srgb, var(--accent) 70%, transparent)); }
  #drive .unit[data-on="1"] .plate { opacity: 1; }
  #drive .unit[aria-disabled="true"] { opacity: .35; }
  #now { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 6px; font: 600 16px var(--mono); color: var(--ink); min-width: 0; }
  #now .g { width: 26px; height: 26px; flex: none; color: var(--accent); }
  #now-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now-bar { position: relative; height: 3px; background: var(--line); margin: 0 6px; }
  #now-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); }
  #vstatus { min-height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 6px; font: 600 15px var(--mono); color: var(--green); }
  #vstatus[hidden] { display: flex !important; visibility: hidden; }
  #vstatus .lvbar { width: 70px; height: 6px; background: var(--line); position: relative; flex: none; }
  #vstatus .lvbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); }
  #vstatus .vtxt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* each key's own theme (the Captain, 2026-11-01): the book Audible orange, discovery psychedelic, library black/red/orange stripes */
  #k-book { --accent: #ff9900 !important; }
  #k-book .plate { opacity: .9; }
  #k-book .plate::before { background: radial-gradient(circle at 50% 42%, rgba(255, 153, 0, .16), #0b0600 70%); }
  #k-disc { --accent: #ff4fd8 !important; }
  #k-disc .plate { opacity: 1; background: conic-gradient(from 0deg, #ff004c, #ffb300, #b6ff00, #00ffd5, #2b6bff, #c800ff, #ff004c);
                   animation: drive-trip 6s linear infinite; }
  #k-disc .plate::before { background: radial-gradient(circle at 50% 45%, rgba(120, 0, 255, .22), #05010a 72%); }
  #k-disc .g { animation: drive-trip 6s linear infinite; }
  @keyframes drive-trip { to { filter: hue-rotate(360deg); } }
  #k-lib { --accent: #ff5a00 !important; }
  #k-lib .plate { opacity: 1; background: #ff3b00; }
  #k-lib .plate::before { background: repeating-linear-gradient(135deg, #000 0 18px, #3a0000 18px 26px, #000 26px 34px, #3a1600 34px 42px); }
  #k-lib .g { color: #ff6a00; filter: drop-shadow(0 0 4px #c00000); }
  #k-lib .g.sub { color: #ff2a00; }
  @media (prefers-reduced-motion: reduce) { #k-disc .plate, #k-disc .g { animation: none; } }
  /* play/pause and next share one key, split down the middle */
  #k-play .pair { position: relative; z-index: 1; display: flex; width: 100%; height: 100%; align-items: center; justify-content: space-around; }
  #k-play .pair .g { width: 36%; }
  #k-play .split { position: absolute; z-index: 1; left: 50%; top: 18%; bottom: 18%; width: 1px; background: var(--accent); opacity: .5; }
  #k-play .hit.play { right: 50%; } #k-play .hit.next { left: 50%; }
  #k-skippy .face { position: relative; z-index: 1; height: 86%; aspect-ratio: 1; max-width: 92%; }
  #k-skippy .face img, #k-skippy .face canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #k-skippy .face canvas { opacity: 0; } #k-skippy.live .face canvas { opacity: 1; } #k-skippy.live .face img { display: none; }
  #k-house .lamps { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10% 8%; width: 78%; }
  #k-house .lamps i { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; color: var(--muted); opacity: .45; }
  #k-house .lamps i .g { width: 70%; max-width: 54px; height: auto; aspect-ratio: 1; stroke-width: 1.4; }
  #k-house .lamps i[data-ok="1"] { color: var(--green); opacity: 1; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--green) 60%, transparent)); }
  #k-house .lamps i[data-ok="0"] { color: var(--red); opacity: 1; animation: drive-blink 1.4s ease-in-out infinite; }
  @keyframes drive-blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #k-house .lamps i[data-ok="0"] { animation: none; } }
  #vstatus .vx { background: none; border: 1px solid var(--green); color: var(--green); width: 34px; height: 34px; font-size: 20px; }
</style>
{% endblock %}
{% block content %}
<section id="drive"
         data-music-gate="{{ url_for('music.player_gate') }}" data-favorites="{{ url_for('music.favorites_list') }}"
         data-book-gate="{{ url_for('audiobooks.gate') }}" data-voice-gate="{{ url_for('chat.voice_gate') }}"
         data-send="{{ url_for('housechat.home_chat_send') }}" data-events="{{ url_for('housechat.home_chat_events') }}"
         data-ort="{{ url_for('static', filename='vendor/ort/') }}"
         data-sp-mix="{{ url_for('drive.spotify_mix') }}" data-sp-car="{{ url_for('drive.spotify_car') }}"
         data-sp-play="{{ url_for('drive.spotify_play') }}" data-sp-pause="{{ url_for('drive.spotify_pause') }}"
         data-house="{{ url_for('drive.house') }}" data-frames="{{ url_for('static', filename='skippy/face/') }}">
  <div id="now" aria-live="polite"><svg class="g" aria-hidden="true"><use id="now-g" href="#g-wheel"/></svg><span id="now-t"></span></div>
  <div id="now-bar"><i></i></div>
  <div class="deck">
    <div class="unit named" id="k-book" style="--accent: var(--violet); --i: 0">
      <i class="plate"></i><i class="claws"><b></b><b></b><b></b></i><span class="lamp"></span>
      <svg class="g" aria-hidden="true"><use href="#g-book"/></svg>
      <span class="name" id="k-book-t"></span>
      <button class="hit" type="button" aria-label="Play my audiobook"></button>
    </div>
    <div class="unit named" id="k-disc" style="--accent: var(--pink); --i: 1">
      <i class="plate"></i><i class="claws"><b></b><b></b><b></b></i><span class="lamp"></span>
      <svg class="g" aria-hidden="true"><use href="#g-shuffle"/></svg><svg class="g sub" aria-hidden="true"><use href="#g-globe"/></svg>
      <span class="name" id="k-disc-t"></span>
      <button class="hit" type="button" aria-label="Bilby Shuffle: discovery (everything, favorites mixed in)"></button>
    </div>
    <div class="unit named" id="k-lib" style="--accent: var(--pink); --i: 2">
      <i class="plate"></i><i class="claws"><b></b><b></b><b></b></i><span class="lamp"></span>
      <svg class="g" aria-hidden="true"><use href="#g-shuffle"/></svg><svg class="g sub" aria-hidden="true"><use href="#g-star"/></svg>
      <span class="name" id="k-lib-t"></span>
      <button class="hit" type="button" aria-label="Bilby Shuffle: library (my favorites)"></button>
    </div>
    <div class="unit named" id="k-skippy" style="--accent: var(--green); --i: 3">
      <i class="plate"></i><i class="claws"><b></b><b></b><b></b></i><span class="lamp"></span>
      <span class="face" aria-hidden="true"><img src="{{ url_for('static', filename='skippy/skippy-head.png') }}" alt="" width="256" height="256"><canvas width="480" height="480"></canvas></span>
      <button class="hit voice" type="button" aria-label="Skippy"><svg style="display:none" aria-hidden="true"><use href="#g-ear"/></svg></button>
    </div>
    <div class="unit" id="k-play" style="--i: 4">
      <i class="plate"></i><i class="claws"><b></b><b></b><b></b></i><span class="lamp"></span>
      <span class="pair"><svg class="g" aria-hidden="true"><use id="k-play-g" href="#g-play"/></svg><svg class="g" aria-hidden="true"><use id="k-next-g" href="#g-next"/></svg></span>
      <i class="split"></i>
      <button class="hit play" type="button" aria-label="Play or pause"></button>
      <button class="hit next" type="button" aria-label="Next song, or 30 seconds on in the book"></button>
    </div>
    <div class="unit" id="k-house" style="--accent: var(--green); --i: 5">
      <i class="plate"></i><i class="claws"><b></b><b></b><b></b></i><span class="lamp"></span>
      <span class="lamps">{% for id, glyph, name in lamps %}<i data-lamp="{{ id }}" title="{{ name }}"><svg class="g" aria-hidden="true"><use href="#g-{{ glyph }}"/></svg></i>{% endfor %}</span>
      <button class="hit" type="button" aria-label="The house: what is up and reachable"></button>
    </div>
  </div>
  <div id="vstatus" hidden></div>
  <audio id="media" preload="auto"></audio>
</section>
<script src="{{ url_for('static', filename='audiobooks-pure.js') }}"></script>
<script src="{{ url_for('static', filename='drive-pure.js') }}"></script>
<script src="{{ url_for('static', filename='skippy-voice.js') }}"></script>
<script src="{{ url_for('static', filename='skippy-face.js') }}"></script>
<script src="{{ url_for('static', filename='skippy-wake.js') }}"></script>
<script src="{{ url_for('static', filename='vendor/ort/ort.wasm.min.js') }}"></script>
<script src="{{ url_for('static', filename='drive-app.js') }}"></script>
{% endblock %}
