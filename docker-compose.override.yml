# Home → portal bridge. Docker Compose merges this file into docker-compose.yml
# automatically, so a plain `docker compose up -d --build` on skippy-pc runs
# these alongside flask-api (same network: they reach each other by
# service name). Nothing here publishes a port to the network: everything goes OUT to
# the portal, except music-gate and video-gate, which listen on 127.0.0.1 for Tailscale Funnel.
services:
  # Bilby's Audio Service's library: MP3/AAC files under a pass only the portal can sign
  # (services/music-gate/gate.py). On the internet through Tailscale Funnel on
  # the host: `tailscale funnel --bg 3005` → https://skippy-pc.<tailnet>.ts.net/
  music-gate:
    build: ./services/music-gate
    container_name: skippytel-music-gate
    restart: unless-stopped
    env_file: G:/My Drive/vault/.env           # SKIPPY_HOME_TOKEN: the pass key is derived from it
    environment:
      # Bilby's "what the song is about" lines, from skippy-core's flask-api over the compose network (the default; set here
      # so it's visible). Refreshed every few hours; if flask-api is down the gate serves the copy it kept in /state.
      LYRICS_URL: http://flask-api:5000/music/lyric-summaries
      # LYRICS_MATCH: song (default; a line fits every file of the song) | path (only the per-file entries)
      # ART_CACHE_MB: 600 (the thumbnail cache's limit, in /state/art-cache)
    ports:
      - "127.0.0.1:3005:8080"                  # localhost only; Funnel is the one way in from outside
    volumes:
      - D:/Aaron/Music/corrected_music:/music:ro
      - ./state/music-gate:/state               # tag cache (a restart doesn't re-read 21k files), lyric lines, thumbnails
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  # Nagatha's Video Service: the Captain's Jellyfin (a Windows service on this host, :8096) for the browser, behind the
  # same kind of pass (services/video-gate/gate.py, README.md). The Jellyfin API key is ADMIN level: it stays inside this
  # container (the vault's JELLYFIN_API_KEY) and the internet only sees the gate's whitelist. Funnel only offers 443 (the
  # music gate has it), 8443 and 10000, so this one goes out on 8443 of the same hostname:
  #   tailscale funnel --https=8443 --bg 3006   → https://skippy-pc.<tailnet>.ts.net:8443/
  video-gate:
    build: ./services/video-gate
    container_name: skippytel-video-gate
    restart: unless-stopped
    env_file: G:/My Drive/vault/.env           # SKIPPY_HOME_TOKEN (the pass key is derived from it) and JELLYFIN_API_KEY
    environment:
      JELLYFIN_URL: http://host.docker.internal:8096   # Jellyfin runs on the host, not in Docker (the default; set so it's visible)
      # JELLYFIN_USER: the account whose library and watch state the player shows (default: the first administrator)
      # HLS_MAX_TRANSCODES: 2 · MAX_STREAMS: 32 · IMG_CACHE_MB: 500 · CATALOG_REFRESH_S: 300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3006:8080"                  # localhost only; Funnel is the one way in from outside
    volumes:
      - ./state/video-gate:/state               # poster cache (/state/img, bounded)
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  # Skippy's ears and mouth for the portal's chats (/chat and /me): a microphone recording to Whisper, and Skippy's voice from
  # tts-studio (Kokoro stock + F5-TTS clone). The same kind of pass as the other gates (services/voice-gate/gate.py). Funnel's
  # third port:   tailscale funnel --https=10000 --bg 3007   -> https://skippy-pc.<tailnet>.ts.net:10000/
  voice-gate:
    build: ./services/voice-gate
    container_name: skippytel-voice-gate
    restart: unless-stopped
    env_file: G:/My Drive/vault/.env           # SKIPPY_HOME_TOKEN (the pass key is derived from it)
    environment:
      WHISPER_URL: http://whisper:8000
      TTS_STUDIO_URL: http://tts-studio:8003   # the local voices (stock = Kokoro, skippy = F5 clone); which one is the pass's call
    networks: [default, tts-net]               # tts-net: the only way to reach the offline tts-studio
    volumes:
      - ./state/voice-gate:/state                # cache of what was already said
    ports:
      - "127.0.0.1:3007:8080"                  # localhost only; Funnel is the one way in from outside
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  # popup-gate: a file a pop-up should work on (a whole track to split into stems), too big for a chat message, comes home straight
  # from the browser on a pass the portal signs (docs/popups.md "Big files"). Funnel's :10000/in mount is its one way in.
  popup-gate:
    build: ./services/popup-gate
    container_name: skippytel-popup-gate
    restart: unless-stopped
    env_file: G:/My Drive/vault/.env           # SKIPPY_HOME_TOKEN (the pass key is derived from it)
    volumes:
      - ./state/popup-inputs:/inputs           # the files, kept a day; the home reporter reads them (read-only)
    ports:
      - "127.0.0.1:3008:8080"                  # localhost only; Funnel (:10000 /in) is the one way in from outside
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  # Pushes status + Bilby's music to the portal every ~15 s, and fetches the
  # portal's jobs (controls, physics questions for Mentat). See CLAUDE.md.
  home-reporter:
    build: ./services/home-reporter
    container_name: skippytel-home-reporter
    restart: unless-stopped
    networks: [default, music-net]             # music-net: the only way to reach the offline music studio
    env_file: G:/My Drive/vault/.env           # same shared .env as flask-api: SKIPPY_HOME_TOKEN ("Pair home"), BILBY_MAC_URL
    environment:
      SKIPPY_API: http://flask-api:5000
      MENTAT_URL: http://skippy-core:7350      # Mentat with Core's chat model, on skippy-core (tailnet only, core/install/tailnet.sh)
      MUSIC_URL: http://music-studio:8001      # ACE-Step: the portal chat's make_music
      IMAGE_URL: http://image-studio:8002      # FLUX.2 klein: the portal chat's make_image, the QUICK tier (this PC, beside the voices)
      IMAGE_HQ_URL: http://skippy-core:7347    # make_image_hq, the QUALITY tier: Qwen-Image on skippy-core (core/image-studio), tailnet only
      CAR_URL: http://skippy-core:7351         # the Captain's Tesla: TeslaMate's latest state from skippy-core's car reader (core/car), tailnet only
      OLLAMA_URL: http://skippy-core:11434          # unloaded before a song so it gets the whole GPU
      CLAUDE_BRIDGE_URL: http://host.docker.internal:9337   # Claude Code's bridge on the host: the private Skippy on /me
      MUSIC_GATE_URL: http://music-gate:8080   # Bilby's Audio Service's library...
      MUSIC_GATE_PUBLIC: https://skippy-pc.tailab2cc7.ts.net   # ...and its Tailscale Funnel address (not a secret)
      VIDEO_GATE_URL: http://video-gate:8080   # Nagatha's Video Service's library (its /health "ready")...
      VIDEO_GATE_PUBLIC: https://skippy-pc.tailab2cc7.ts.net:8443   # ...and its Funnel address: 443 is the music gate's
      VOICE_GATE_URL: http://voice-gate:8080   # Skippy's ears and mouth (its /health "ready")...
      VOICE_GATE_PUBLIC: https://skippy-pc.tailab2cc7.ts.net:10000   # ...and its Funnel address: the third port
      POPUP_GATE_URL: http://popup-gate:8080   # big files for pop-ups (its /health "ready")...
      POPUP_GATE_PUBLIC: https://skippy-pc.tailab2cc7.ts.net:10000/in   # ...and its Funnel address: a path on the voice gate's port
    ports:
      - "127.0.0.1:47450:47450"                # the private Skippy's quick pop-up tools (services/home-reporter/local_api.py): this PC only
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./state/imports:/imports:ro   # game databases to carry to the games VM (see CLAUDE.md)
      - ./state/insights:/insights    # what guests' expired chats taught (portal/chat_history.py): chat-insights.jsonl, read by the agent
      - ./services:/srv/services:ro   # the pop-up registry (docs/popups.md): services/popups/registry.json + services/*-popups/popups.json
      - ./state/popup-inputs:/popup-inputs:ro   # big files for pop-ups, from the popup-gate (docs/popups.md "Big files")
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  # wa-trickle: a slow, free Wolfram|Alpha vs Mentat comparison. One verbatim Wolfram call per queued question, ever, on a daily
  # budget (WA_DAILY_BUDGET, default 60, inside the free tier's 2,000 a month); the same question to Mentat, again per commit.
  # Queue, answers and the budget live in ./state/wa-trickle/trickle.sqlite. Port on localhost only (the loader and the
  # scorer in sigma-ground's tools/wa_trickle_*.py talk to it). See services/wa-trickle/trickle.py.
  wa-trickle:
    build: ./services/wa-trickle
    container_name: skippytel-wa-trickle
    restart: unless-stopped
    env_file: ${WA_TRICKLE_STATE:-./state/wa-trickle}/wolfram.env   # ONE line, WOLFRAM_ALPHA_APP_ID=..., copied from the vault:
                                                                    # this service does not get the rest of the vault (services/wa-trickle/setup.sh)
    environment:
      MENTAT_URL: http://skippy-core:7350
      WA_DAILY_BUDGET: "60"
      WA_MONTHLY_CAP: "1900"
      WA_INTERVAL_S: "900"
    ports:
      - "127.0.0.1:3010:8080"
    volumes:
      - ${WA_TRICKLE_STATE:-./state/wa-trickle}:/state    # the queue's SQLite file; set WA_TRICKLE_STATE when deploying from a worktree
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  # image-studio: the QUICK picture tier (make_image), FLUX.2 klein 4B on this PC's GPU: ~3 s a picture, ~7.5 GB of the card
  # while loaded, unloaded after 10 idle minutes (the quality tier is Qwen-Image on skippy-core). Its weights are a copy of the
  # nightly archive's, in a Docker volume on the SSD, because Docker reads D:/models at ~8 MB/s: fill it with
  # `python services/image-studio/seed_weights.py --prepare skippytel-image-studio` (after a build). Offline. mem_limit: a
  # load that runs away is killed here, not in Docker's 8 GB VM (which hung once). No published port: only the reporter calls it.
  image-studio:
    build: ./services/image-studio
    container_name: skippytel-image-studio
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      MODEL: flux2-klein-4b
    volumes:
      - image-studio-weights:/weights:ro
    mem_limit: 5g
    shm_size: "1gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  # tts-studio: Skippy chat's local voices on this PC's GPU (services/tts-studio/app.py), reached only by voice-gate. stock = Kokoro-82M
  # (everyone), skippy = F5-TTS zero-shot from the Captain's reference cut (personal use: the Captain only; the pass decides). The
  # weights are D:/models' own copies, read-only; the reference cut (ref.wav + ref.txt, not in git) lives in state/tts-studio/ref.
  # Internal network only: no route out, no published port. Both voices are RESIDENT: loaded once at start, warm, never unloaded,
  # and the process then holds VOICE_VRAM_GB of the card (the Captain's rule: voice keeps reserved GPU on skippy-pc; pictures go to
  # skippy-core). The reference is the 9 s print of his ElevenLabs Skippy voice (state/voice-bakeoff/ref-el, his pick, 2026-10-23).
  tts-studio:
    build: ./services/tts-studio
    container_name: skippytel-tts-studio
    restart: unless-stopped
    networks: [tts-net]
    expose:
      - "8003"
    environment:
      STOCK_VOICE: bm_george                   # Kokoro's voices/<name>.pt; the first letter is its accent (a = American, b = British)
      RESIDENT: skippy,stock                   # loaded at start (in this order) and kept; a voice left out loads on its first line
      VRAM_MARGIN_GB: "1.5"                    # a load or the reserve happens only with this much of the card left free; else it waits
                                               # and retries (a full card spills into Docker's 8 GB VM and freezes it)
      IDLE_UNLOAD_S: "0"                       # only for voices not RESIDENT; 0 = never unload
      F5_NFE: "16"                             # F5's flow steps: 16 = about 0.6 s a line at 4 % word errors (the bake-off; 32 is 3x slower)
      VOICE_VRAM_GB: "3"                       # held by this process after the warm-up (both models need ~2.5 GB at peak)
    volumes:
      - ${MODELS_ROOT:-D:/models}/huggingface/hexgrad__Kokoro-82M:/w/kokoro:ro
      - ${MODELS_ROOT:-D:/models}/huggingface/SWivid__F5-TTS:/w/f5:ro
      - ${TTS_REF_DIR:-./state/tts-studio/ref}:/ref:ro   # set TTS_REF_DIR when deploying from a worktree
    shm_size: "1gb"
    mem_limit: 5g                              # both models load through RAM first (~3 GB peak): a runaway is this container's kill, not the VM's
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

networks:
  tts-net:
    internal: true

volumes:
  image-studio-weights:
