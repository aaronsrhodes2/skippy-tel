# SkippyTel — PC-side AI inference for the Skippy AR system.
#
# Phone (SkippyDroid) hits http://skippy-pc:3003 over Tailscale. See
# misc/SKIPPYTEL_BRIEF.md for the full endpoint contract.
#
# Bind doctrine (per brief): Tailscale mesh + loopback ONLY. The host
# port mapping below relies on the PC's firewall / Tailscale ACLs to
# keep this off the public internet. Do not publish 3003 to a public
# interface without revisiting the Phase 2 auth model.

# Anchor reused by every service so json-file logs don't grow without
# bound. Each container keeps the last 30 MB of logs (3 × 10 MB) before
# rotating. Tune up if /intent/unmatched SSE chatter outgrows this.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  flask-api:
    build: ./services/flask-api
    container_name: skippytel-flask-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3003:5000"          # external 3003 — paired with SkippyDroid egress (Z-Phone).
                            # Different machines, never collide. Internal 5000 = Flask convention.
    env_file: G:/My Drive/vault/.env       # Platinum Rule §10 — single dev-root vault
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WHISPER_BASE_URL=http://whisper:8000
    extra_hosts:
      # /health pings the host-side claude-bridge (the private Skippy's engine) through this mapping.
      # host-gateway resolves to the Docker host on Linux and Windows Docker Desktop alike.
      - "host.docker.internal:host-gateway"
    volumes:
      # APK staging: copy built APKs here, served at /apk/<name>
      # Update by running: make apks  (or copy manually to SkippyTel/apks/)
      - ./apks:/apks:ro
      # Google Drive OAuth credentials for DropShip image service.
      # Read-write so the token file can be refreshed inside the container.
      - ../music-collection/state:/drive-state:rw
      # Persistent state: service icon cache (SD-generated PNGs), token files, etc.
      # Delete state/icons/<id>.png to force icon regeneration.
      - ./state:/app/state:rw
      # Local music library (Syncthing-synced corrected_music folder, read-only)
      - D:/Aaron/Music/corrected_music:/music:ro
    depends_on:
      - ollama
      - whisper
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:5000/health'); sys.exit(0)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: skippytel-ollama
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  whisper:
    build: ./services/whisper
    container_name: skippytel-whisper
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8000"
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - whisper-cache:/root/.cache/huggingface   # model weights persist
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Music studio — ACE-Step 1.5 (songs on the GPU) ────────────────────────
  # Called only by the home reporter (portal chat's make_music). No published
  # port. Weights come read-only from the models archive; nothing is fetched.
  music-studio:
    build: ./services/music-studio
    container_name: skippytel-music-studio
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "8001"
    networks: [music-net]      # internal: no route to the internet (see the networks block)
    volumes:
      - ${MODELS_ROOT:-D:/models}/huggingface/ACE-Step__Ace-Step1.5:/weights:ro
      - music-studio-cache:/app/.cache          # compiled kernels + scratch audio
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Dozzle — real-time Docker log viewer ──────────────────────────────────
  # Survives flask-api crashes. Shows live logs from all containers.
  # Dashboard: http://localhost:9999
  dozzle:
    image: amir20/dozzle:latest
    container_name: skippytel-dozzle
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info   # show INFO and above; drop to debug for raw output

  # ── Uptime Kuma — model server health monitoring ───────────────────────────
  # Polls each service independently. Shows status page + optional alerts.
  # Dashboard: http://localhost:3001
  # First launch: create an admin account, then add monitors for:
  #   http://skippytel-flask-api:5000/health (via Docker network)
  #   http://skippytel-ollama:11434          (Ollama root responds 200)
  #   http://skippytel-whisper:8000/health
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: skippytel-uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

# ACE-Step's server downloads any model it thinks is missing. It's on this network alone, which has
# no route out, so it can only ever run the weights we mounted. The home reporter joins it too.
networks:
  music-net:
    internal: true

volumes:
  ollama-data:
  whisper-cache:
  uptime-kuma-data:
  music-studio-cache:
